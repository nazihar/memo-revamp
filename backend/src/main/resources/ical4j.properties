# ical4j 4.4.0 (ADR-0063). No run-time call to tzurl.org: the updater is a hosted service (AGENTS.md §3.1) and has hung
# servers' threads. Invitations carry a VTIMEZONE built from the JVM's own zone rules (VTimezones), so the bundled
# definitions are only read when a test parses a file back. Validation stays strict on output.
net.fortuna.ical4j.timezone.update.enabled=false
