# Phase 4 E02 submissions (design E02 §3, §4; ADR-0059). Forum and submission ids are random here, so every subject is
# answered 404 before the officer check; who may triage is ForumSubmissionsIT.
epic: P4-E02
endpoints:
  - { endpoint: "GET /api/v1/forums/{forumId}/submissions", rule: signedIn }
  - { endpoint: "GET /api/v1/forums/{forumId}/submissions/{id}", rule: signedIn }
  - endpoint: "PATCH /api/v1/forums/{forumId}/submissions/{id}"
    rule: signedIn
    body: { purpose: "DECISION" }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/forums/{forumId}/submissions/{id}/accept", rule: signedIn, headers: { If-Match: "\"0\"" } }
  - endpoint: "POST /api/v1/forums/{forumId}/submissions/{id}/defer"
    rule: signedIn
    body: { reason: "Matrix" }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/forums/{forumId}/submissions/{id}/return"
    rule: signedIn
    body: { reason: "Matrix" }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/forums/{forumId}/submissions/{id}/decline"
    rule: signedIn
    body: { reason: "Matrix" }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/forums/{forumId}/submissions/{id}/refer"
    rule: signedIn
    body: { forumId: "{random}", reason: "Matrix" }
    headers: { If-Match: "\"0\"" }
