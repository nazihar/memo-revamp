# Phase 4 E06 T4 resolutions (design E06 §1.3, §1.9, §3, §4; ADR-0065). Forum and resolution ids are random here, so every
# subject allowed through is answered 404 before any role check (and before the starting number's step-up, so a stale
# session is 404 too). Who may do what on a real committee (its secretary, the chair, a member, forum.read, forums.manage
# with and without a fresh step-up, someone outside, a memo's reader) is ResolutionsIT; another tenant MinutesCrossTenantIT;
# a recused member, a recused secretary and the alternate of a recused member the leak suites (RESOLUTIONS surface).
epic: P4-E06
endpoints:
  # The committee's register and its check: its officers, forums.manage and forum.read; a member 403, others 404.
  - { endpoint: "GET /api/v1/forums/{forumId}/resolutions", rule: signedIn }
  - { endpoint: "GET /api/v1/forums/{forumId}/resolutions/check", rule: signedIn }
  # One resolution: whoever sees its item's decision, and its memo's readers.
  - { endpoint: "GET /api/v1/resolutions/{resolutionId}", rule: signedIn }
  # The starting number of a period: forums.manage with a fresh step-up, once.
  - endpoint: "PUT /api/v1/forums/{forumId}/resolution-counters/{period}"
    rule: signedIn
    body: { next: 14 }
    headers: { Idempotency-Key: "{random}" }
