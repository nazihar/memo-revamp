# Meeting invitations (ADR-0063, design E05 §1.2.1): the iCalendar DESCRIPTION and LOCATION, plain {name} placeholders.
# Never the agenda, item titles, papers, classification or a cancellation reason.
invite.reply.IN_PERSON=Please tell us whether you will attend: open the meeting in memo and choose "Yes, in person" or "No, I send my apologies".
invite.reply.ONLINE=Please tell us whether you will attend: open the meeting in memo and choose "Yes, online" or "No, I send my apologies".
invite.reply.HYBRID=Please tell us whether you will attend: open the meeting in memo and choose "Yes, in person", "Yes, online" or "No, I send my apologies".
invite.buttons=Your calendar's Accept and Decline buttons do not reach the committee secretary.
invite.meeting=Meeting: {link}
invite.join=Join online: {link}
invite.details=Joining details: {details}
invite.cancelled=This meeting has been cancelled.
invite.uninvited=You are no longer invited to this meeting.
invite.online=Online meeting
# What changed, in the update email (design E05 §1.1): one sentence per change, in this order.
invite.change.TIME=The date or time changed.
invite.change.PLACE=The place changed.
invite.change.LINK=The joining link or details changed.
invite.change.TITLE=The title changed.
