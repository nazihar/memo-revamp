# Email templates (ADR-0030), English. {name} placeholders are filled from the template's parameters; subjects take
# none and never carry sensitive content (AGENTS.md section 3.4). Keep every key in every language file.
mail.INVITATION.subject=You are invited to memo
mail.INVITATION.body=Hello {name},\n\n{inviter} invited you to {organisation} on memo. Set your password and get started:\n\n{link}\n\nThe link works once and expires in 7 days. If you did not expect this invitation, you can ignore this email.
mail.PASSWORD_RESET.subject=Reset your memo password
mail.PASSWORD_RESET.body=Hello {name},\n\nSomeone asked to reset your password for {organisation} on memo. Choose a new one here:\n\n{link}\n\nThe link works once and expires in 30 minutes. If it was not you, ignore this email: your password stays as it is.
mail.PASSWORD_CHANGED.subject=Your memo password was changed
mail.PASSWORD_CHANGED.body=Hello {name},\n\nThe password of your account at {organisation} was just changed, and your other sessions were signed out.\n\nIf this was not you, contact your administrator now.
mail.MFA_RESET.subject=Your memo sign-in was reset
mail.MFA_RESET.body=Hello {name},\n\nAn administrator at {organisation} reset your two-step sign-in. You will set up your authenticator app again the next time you sign in.\n\nIf you did not expect this, contact your administrator.
mail.SIGN_IN_ALERT.subject=New sign-in to memo
mail.SIGN_IN_ALERT.body=Hello {name},\n\nYour account at {organisation} was signed in to from a new device:\n\n{device}\n{time} (UTC)\n\nIf this was not you, change your password and contact your administrator.
mail.ROLE_GRANTED.subject=Your access in memo changed
mail.ROLE_GRANTED.body=Hello {name},\n\nYou were given the role {role} at {organisation}. It takes effect the next time you open memo.\n\nIf you did not expect this, contact your administrator.
mail.TEST.subject=memo test email
mail.TEST.body=Hello {name},\n\nThis test email from {organisation} on memo came through the configured mail relay. No action is needed.
mail.TASK_ASSIGNED.subject=A memo is waiting for your approval
mail.TASK_ASSIGNED.body=Hello {name},\n\n{memo} {reference} at {organisation} is waiting for your approval. Open it here:\n\n{link}
mail.MEMO_RETURNED.subject=A memo was returned to you
mail.MEMO_RETURNED.body=Hello {name},\n\n{memo} {reference} at {organisation} was returned to you. Open it to see the remark:\n\n{link}
mail.MEMO_REJECTED.subject=A memo was rejected
mail.MEMO_REJECTED.body=Hello {name},\n\n{memo} {reference} at {organisation} was rejected. Open it to see the remark:\n\n{link}
mail.MEMO_APPROVED.subject=Your memo was approved
mail.MEMO_APPROVED.body=Hello {name},\n\n{memo} {reference} at {organisation} was approved by everyone on its route:\n\n{link}
mail.TASK_REASSIGNED.subject=A memo task was reassigned
mail.TASK_REASSIGNED.body=Hello {name},\n\nAn administrator at {organisation} reassigned the approval of {memo} {reference}. Open it to see who holds it now:\n\n{link}
mail.TASK_BLOCKED.subject=A memo is waiting for reassignment
mail.TASK_BLOCKED.body=Hello {name},\n\nThe next approver of {memo} {reference} at {organisation} cannot act on it at the moment. An administrator needs to give the task to someone else:\n\n{link}
mail.MEMO_WITHDRAWN.subject=A memo you were reviewing was withdrawn
mail.MEMO_WITHDRAWN.body=Hello {name},\n\n{memo} {reference} at {organisation} was withdrawn by its initiator. Nothing is needed from you.\n\n{link}
mail.MEMO_UPDATE.subject=News about a memo
mail.MEMO_UPDATE.body=Hello {name},\n\n{memo} {reference} at {organisation} reached a step that keeps you informed. Open it to see where it is:\n\n{link}
mail.MEMO_COPIED.subject=A memo copied to you
mail.MEMO_COPIED.body=Hello {name},\n\n{memo} {reference} at {organisation} was copied to you for information. You can read it here:\n\n{link}
mail.MEMO_MENTIONED.subject=You were mentioned on a memo
mail.MEMO_MENTIONED.body=Hello {name},\n\nSomeone mentioned you in a note on {memo} {reference} at {organisation}. Open it to read the note:\n\n{link}
mail.TASK_REMINDER.subject=Reminder: a memo is waiting for you
mail.TASK_REMINDER.body=Hello {name},\n\n{memo} {reference} at {organisation} is waiting for your decision. Open it to see when it is due:\n\n{link}
mail.TASK_OVERDUE.subject=A memo is overdue
mail.TASK_OVERDUE.body=Hello {name},\n\nThe current step of {memo} {reference} at {organisation} is past its due time. Open it to see who holds it:\n\n{link}
mail.footer=This message was sent by memo. Do not reply to it.

# Default terms (ADR-0032): {unit}, {units}, {position}, {positions}, {memo}, {memos}, {forum}, {forums} in templates; tenants may override.
term.unit.one=unit
term.unit.other=units
term.position.one=position
term.position.other=positions
term.memo.one=memo
term.memo.other=memos
term.forum.one=committee
term.forum.other=committees
mail.WATCH_UPDATE.subject=News on a memo you follow
mail.WATCH_UPDATE.body=Hello {name},\n\nThere is news on {memo} {reference} at {organisation}, which you follow. Open it to see what changed:\n\n{link}\n\nYou can stop following it from the memo, or change how you hear about memos you follow in your notification settings.
mail.WATCH_DIGEST.subject=Your daily summary of followed memos
mail.WATCH_DIGEST.body=Hello {name},\n\n{count} memos you follow at {organisation} have news since yesterday. See them on your Watching list:\n\n{link}\n\nYou can change how you hear about memos you follow in your notification settings.
mail.FORUM_MEMBERSHIP_CHANGED.subject=A committee membership changed
mail.FORUM_MEMBERSHIP_CHANGED.body=Hello {name},\n\nThe membership of {committee} at {organisation} changed. Open it to see who sits on it now:\n\n{link}\n\nIf you did not expect this, contact the secretary of the committee.
mail.FORUM_TERM_ENDING.subject=A term of office ends soon
mail.FORUM_TERM_ENDING.body=Hello {name},\n\nThe term of office of {member} on {committee} at {organisation} ends soon. Renew it or record its end:\n\n{link}
mail.FORUM_SUBMISSION_RECEIVED.subject=A paper is waiting for your committee
mail.FORUM_SUBMISSION_RECEIVED.body=Hello {name},\n\nA paper was sent to {committee} at {organisation}. Open the queue to accept, defer or return it:\n\n{link}
mail.FORUM_SUBMISSION_TRIAGED.subject=News on a paper you sent to a committee
mail.FORUM_SUBMISSION_TRIAGED.body=Hello {name},\n\n{committee} at {organisation} has looked at your paper. Open it to see where it stands and any reason given:\n\n{link}
mail.FORUM_SUBMISSION_WAITING.subject=A paper is still waiting for triage
mail.FORUM_SUBMISSION_WAITING.body=Hello {name},\n\nA paper sent to {committee} at {organisation} has not been accepted, deferred or returned yet, and its author is waiting for an answer:\n\n{link}
mail.MEETING_CANCELLED.subject=A meeting was cancelled
mail.MEETING_CANCELLED.body=Hello {name},\n\nThe meeting of {committee} at {organisation} on {date} has been cancelled. Open it to see the reason:\n\n{link}
mail.MEETING_LATE_PAPER.subject=A late paper needs your agreement
mail.MEETING_LATE_PAPER.body=Hello {name},\n\nA paper for the meeting of {committee} at {organisation} on {date} arrived after the papers were due. It goes on the agenda only if you agree. Open the meeting to agree or decline:\n\n{link}
mail.MEETING_AGENDA_PUBLISHED.subject=A meeting agenda was published
mail.MEETING_AGENDA_PUBLISHED.body=Hello {name},\n\nThe agenda for the meeting of {committee} at {organisation} on {date} has been published. Open the meeting to read it and its papers. Please read the agenda and declare any interests before the meeting:\n\n{link}
mail.MEETING_AGENDA_CHANGED.subject=A meeting agenda has changed
mail.MEETING_AGENDA_CHANGED.body=Hello {name},\n\nThe agenda for the meeting of {committee} at {organisation} on {date} has changed. Open the meeting to see what changed. If items were added, please declare any interests in them before the meeting:\n\n{link}
mail.MEETING_ITEM_WITHDRAWN.subject=An item left a published agenda
mail.MEETING_ITEM_WITHDRAWN.body=Hello {name},\n\nA paper on the published agenda for the meeting of {committee} at {organisation} on {date} is no longer before the committee, and it has left the draft. Publish a new revision so that members see the change:\n\n{link}
mail.MEETING_DISCUSSION_REQUESTED.subject=A member asked to discuss a consent item
mail.MEETING_DISCUSSION_REQUESTED.body=Hello {name},\n\nA member asked for an item in the consent section of the meeting of {committee} at {organisation} on {date} to be lifted for discussion. Open the meeting to see which item, and move it in the next revision if you need to:\n\n{link}
mail.MEETING_AGENDA_DUE.subject=An agenda is not published yet
mail.MEETING_AGENDA_DUE.body=Hello {name},\n\nThe papers for the meeting of {committee} at {organisation} on {date} were due, and its agenda is not published yet. Open the meeting to finish the agenda and publish it:\n\n{link}
mail.MEETING_NOT_HELD.subject=A meeting is not marked as held
mail.MEETING_NOT_HELD.body=Hello {name},\n\nThe meeting of {committee} at {organisation} on {date} has ended, but it is not marked as held. Open the meeting to record that it took place, or to reschedule or cancel it if it did not:\n\n{link}
mail.MEETING_DECLARATION_RECORDED.subject=Your declarations of interest have changed
mail.MEETING_DECLARATION_RECORDED.body=Hello {name},\n\nA declaration of interest was recorded or changed for you for the meeting of {committee} at {organisation} on {date}. Open the meeting to see it:\n\n{link}
mail.MEETING_DECLARATION_MADE.subject=Declarations of interest have changed
mail.MEETING_DECLARATION_MADE.body=Hello {name},\n\nA declaration of interest for the meeting of {committee} at {organisation} on {date} was made or withdrawn. Open the meeting to see the declarations:\n\n{link}
mail.MEETING_RULING_NEEDED.subject=A declaration of interest needs your ruling
mail.MEETING_RULING_NEEDED.body=Hello {name},\n\nSomeone who declared an interest in an item of the meeting of {committee} at {organisation} on {date} asks you to decide whether they may take part. Their papers for the item are withheld until you rule. Open the meeting to rule:\n\n{link}
mail.MEETING_DECLARATION_RULED.subject=The chair has ruled on your declaration
mail.MEETING_DECLARATION_RULED.body=Hello {name},\n\nThe chair has ruled on your declaration of interest for the meeting of {committee} at {organisation} on {date}. Open the meeting to see the ruling:\n\n{link}
mail.MEETING_DECLARATIONS_DUE.subject=Please declare any interests before the meeting
mail.MEETING_DECLARATIONS_DUE.body=Hello {name},\n\nThe meeting of {committee} at {organisation} is on {date}. Please read its agenda, declare any interests in its items, and confirm that you have done so:\n\n{link}
