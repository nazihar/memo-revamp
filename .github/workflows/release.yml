# Release stage (ADR-0011, ADR-0012): on a version tag, build images, push to GHCR, sign the digests with the cosign
# key pair, attach the CycloneDX SBOMs and SLSA provenance as signed attestations, verify offline-style, and publish the
# licence report. Runs in the protected `release` environment (owner approval). Refuses to publish unsigned images.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/memo-revamp
  COSIGN_VERSION: v3.1.3

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 40
    permissions:
      contents: write   # GitHub release with SBOMs + licence report
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "COSIGN_PRIVATE_KEY secret missing: refusing to publish unsigned images (ADR-0012)"; exit 1; }
          [ -f deploy/cosign.pub ] || { echo "deploy/cosign.pub missing"; exit 1; }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build, test and produce SBOMs + licence report
        run: |
          ./gradlew build :backend:spotbugsMain cyclonedxBom :backend:bootJar --console=plain
          pnpm install --frozen-lockfile
          pnpm --filter web build
          node ci/web-sbom.mjs
          mkdir -p build/sbom && cp build/reports/cyclonedx/bom.json build/sbom/backend.cdx.json
          node ci/license-check.mjs --report build/sbom/licenses.md build/sbom/backend.cdx.json build/sbom/web.cdx.json
      - name: Build and push images
        id: push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          for app in backend web; do
            ref="$IMAGE_PREFIX-$app:$VERSION"
            docker build -f "$app/Dockerfile" --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" -t "$ref" .
            docker push "$ref"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")
            echo "$app=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Install cosign
        run: |
          curl -fsSLo cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          curl -fsSLo cosign.sha256 "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign_checksums.txt"
          grep ' cosign-linux-amd64$' cosign.sha256 | sed 's/cosign-linux-amd64/cosign/' | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign
      - name: Sign digests and attach SBOM + provenance attestations (key-based; verifiable offline)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          BACKEND: ${{ steps.push.outputs.backend }}
          WEB: ${{ steps.push.outputs.web }}
        run: |
          node ci/provenance.mjs > build/provenance.json
          for pair in "backend:$BACKEND:build/sbom/backend.cdx.json" "web:$WEB:build/sbom/web.cdx.json"; do
            IFS=: read -r app image sbom <<<"$pair"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$image"
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --type cyclonedx --predicate "$sbom" "$image"
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --type slsaprovenance1 --predicate build/provenance.json "$image"
            cosign verify --key deploy/cosign.pub --insecure-ignore-tlog "$image" >/dev/null
            echo "$app signed and verified: $image"
          done
      - name: GitHub release with SBOMs, licence report and public key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes \
            build/sbom/backend.cdx.json build/sbom/web.cdx.json build/sbom/licenses.md deploy/cosign.pub build/provenance.json
