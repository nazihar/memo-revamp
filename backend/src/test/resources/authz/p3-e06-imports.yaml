# Phase 3 E06 legacy import (design E06 §10; ADR-0055). memo.import is granted on purpose: no subject of the matrix holds
# it, so every signed-in subject is 403 before the memo is read. Readers without the permission are 403, holders who
# cannot read the memo 404, and holders without a fresh step-up 401 (LegacyCorrectionIT). T5 adds the /admin/imports
# endpoints and the three purposes' uploads.
epic: P3-E06
endpoints:
  - endpoint: "POST /api/v1/memos/{id}/legacy/corrections"
    rule: signedIn
    body: { field: "SUBJECT", value: "Matrix", reason: "Matrix" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/memos/{id}/legacy/reclassify"
    rule: signedIn
    body: { classificationId: "{random}", reason: "Matrix" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
