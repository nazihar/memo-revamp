name: load

# Weekly load stage (TESTING_STRATEGY §7, phase 2 overview E05): synthetic volume V2 (10,000 memos in review with
# their SLA timers, everyone seated in one division under a head) on the on-prem stack, then the Gatling simulations
# against it: the inbox (NFR P1: p95 < 300 ms), and search, the inbox by due time, the team view and the dashboards
# (Phase 3 E05 T8); search at volume V1 (E05 T8), the legacy import at 10,000 memos (Phase 3 E06 T10) and meetings at
# 3,600 meetings, 180,000 items and 600,000 papers (Phase 4 E03 T5), with their decisions, resolutions and minutes (E06 T9),
# action items at 29,000 actions over those meetings (Phase 4 E07 T9), and the decision register at 54,000 and 108,000
# decisions with meeting analytics and the committee load simulation at 50 people (Phase 4 E08 T5).
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      instances:
        description: Memos in review to generate
        default: '10000'

permissions:
  contents: read

concurrency:
  group: load
  cancel-in-progress: false

jobs:
  inbox-v2:
    name: Volume V2 + Gatling inbox, search and team (on-prem stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: ./gradlew :backend:bootJar --console=plain
      - name: Build images and start the on-prem stack with volume V2
        env:
          MEMO_VOLUME_V2: 'true'
          MEMO_VOLUME_INSTANCES: ${{ inputs.instances || '10000' }}
        run: |
          pnpm install --frozen-lockfile && pnpm --filter web build
          docker build -f backend/Dockerfile -t memo-backend:load .
          docker build -f web/Dockerfile -t memo-web:load .
          ci/onprem-stack.sh up memo-backend:load memo-web:load 18100
      - name: Wait for volume V2
        id: volume
        run: |
          # Progress once a minute (the generator logs every 500 memos), so a slow or stuck run shows where it is.
          for i in $(seq 1 600); do
            logs=$(docker compose -p memo-nightly logs backend 2>/dev/null)
            if grep -q 'Volume V2 ready' <<<"$logs"; then grep -o 'Volume V2 ready[^"]*' <<<"$logs"; exit 0; fi
            # A failed start restarts the backend, which then finds the tenant and generates nothing: stop here.
            if grep -q 'Application run failed\|Volume V2: the tenant exists' <<<"$logs"; then echo 'the backend failed to generate volume V2' >&2; exit 1; fi
            if [ $((i % 6)) -eq 0 ]; then echo "$(date -u +%H:%M) $(grep -o 'Volume V2: [^"]*' <<<"$logs" | tail -1)"; fi
            sleep 10
          done
          exit 1
      - if: failure()
        name: Backend log
        run: |
          mkdir -p perf/build/reports/gatling
          docker compose -p memo-nightly logs --no-color backend > perf/build/reports/gatling/backend.log 2>&1 || true
          grep -E '"level":"(WARN|ERROR)"' perf/build/reports/gatling/backend.log | tail -40 >&2 || true
      - name: Inbox load
        run: |
          # The volume users' password, generated into the stack's .env; never printed.
          MEMO_DEMO_PASSWORD=$(grep '^MEMO_DEMO_PASSWORD=' build/onprem-stack/.env | cut -d= -f2-)
          export MEMO_DEMO_PASSWORD
          # Organisations are told apart by host: the volume tenant is volume.<base domain> of the stack.
          domain=$(grep '^MEMO_TENANCY_BASE_DOMAIN=' build/onprem-stack/.env | cut -d= -f2-)
          ./gradlew :perf:gatlingRun --simulation com.memo.perf.InboxLoadSimulation -DbaseUrl=http://127.0.0.1:18100 \
            -DtenantHost="volume.$domain" --console=plain
      - name: Search, team view and dashboards load
        # Runs even when the inbox simulation misses its budget, as long as the volume is there.
        if: ${{ !cancelled() && steps.volume.outcome == 'success' }}
        run: |
          MEMO_DEMO_PASSWORD=$(grep '^MEMO_DEMO_PASSWORD=' build/onprem-stack/.env | cut -d= -f2-)
          # The volume's head holds a privileged permission and signs in with a TOTP code from this secret.
          MEMO_DEMO_TOTP_SECRET=$(grep '^MEMO_DEMO_TOTP_SECRET=' build/onprem-stack/.env | cut -d= -f2-)
          export MEMO_DEMO_PASSWORD MEMO_DEMO_TOTP_SECRET
          domain=$(grep '^MEMO_TENANCY_BASE_DOMAIN=' build/onprem-stack/.env | cut -d= -f2-)
          ./gradlew :perf:gatlingRun --simulation com.memo.perf.SearchAndTeamLoadSimulation -DbaseUrl=http://127.0.0.1:18100 \
            -DtenantHost="volume.$domain" --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-reports
          path: perf/build/reports/gatling/
          retention-days: 30
      - if: always()
        run: ci/onprem-stack.sh down

  search-v1:
    # Search at volume V1 (Phase 3 E05 T8, ADR-0054): the T1 spike, 1,000,000 memos, 2,000,000 notes and 200,000
    # document chunks in one tenant, five reader profiles, with the database settings of the runbook's V1 sizing
    # (docs/runbooks/search.md). Budgets have 2x headroom for shared runners; the measured p95 per profile and query is
    # in the uploaded test report.
    name: Search at volume V1 (SearchPerformanceIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: SearchPerformanceIT at 1,000,000 memos
        env:
          SEARCH_VOLUME: '1000000'
          MEMO_TEST_PG_SETTINGS: 'shared_buffers=3GB effective_cache_size=8GB work_mem=32MB random_page_cost=1.1 maintenance_work_mem=512MB'
        run: ./gradlew :backend:test --tests com.memo.search.SearchPerformanceIT --rerun --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-v1-report
          path: backend/build/test-results/test/TEST-com.memo.search.SearchPerformanceIT.xml
          retention-days: 30

  import-volume:
    # The legacy import at the stated volume (Phase 3 E06 T10, design E06 §14): 10,000 memos with 30,000 originals of
    # 50 KB (about 1.5 GB) through the real pipeline in the test containers (clamd scans each original at intake and at
    # promotion), and a 50,000-row metadata-only dry run. Asserts the dry run (< 5 min) and the import (< 2 h, renditions
    # excluded); the intake, verification, report and purge times, the peak heap and the database size are printed in the
    # uploaded test report.
    name: Legacy import at volume (ImportVolumeIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: ImportVolumeIT at 10,000 memos
        env:
          IMPORT_VOLUME: '10000'
        run: ./gradlew :backend:test --tests com.memo.imports.ImportVolumeIT --rerun --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: import-volume-report
          path: backend/build/test-results/test/TEST-com.memo.imports.ImportVolumeIT.xml
          retention-days: 30

  meeting-volume:
    # Meetings at the design's volume (Phase 4 E03 T5, design E03 §8): 3,600 meetings with 180,000 items and 600,000
    # papers in one tenant, their revisions, audiences and reads. The p95 of each read path (a committee's meetings, "My
    # meetings" with its counts, the draft, the tray, the members' agenda with "What changed", the revision list, a paper
    # open), of a builder change and of a publication, against the budgets with 2x headroom for shared runners; and the
    # plan of every statement those paths run, which may not scan a large table sequentially. The values and the plans are
    # in the uploaded test report. InvitationVolumeIT (Phase 4 E05 T6, design E05 §8) writes the same volume with E05's
    # rows (144,000 invitees, 430,000 messages, 144,000 replies, 290,000 attendance events, 60,000 snapshots) in a tenant of
    # its own, and measures the invitations panel, the replies, the forecast, the register, the live quorum, an attendance
    # event, a snapshot, "My meetings" with answers and a pass of the hourly sweep the same way.
    name: Meetings at volume (MeetingVolumeIT, InvitationVolumeIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: MeetingVolumeIT and InvitationVolumeIT at 3,600 meetings
        env:
          MEETING_VOLUME: '3600'
        run: ./gradlew :backend:test --tests com.memo.meeting.MeetingVolumeIT --tests com.memo.meeting.InvitationVolumeIT --rerun --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeting-volume-report
          path: |
            backend/build/test-results/test/TEST-com.memo.meeting.MeetingVolumeIT.xml
            backend/build/test-results/test/TEST-com.memo.meeting.InvitationVolumeIT.xml
          retention-days: 30

  minutes-volume:
    # Minutes and resolutions at the design's volume (Phase 4 E06 T9, design E06 §8): MeetingVolume with E05's rows and
    # MinutesVolume over it (55,000 decisions with 70,000 entries, 30,000 resolution numbers, 3,240 minutes with 7,000
    # copies and 20,000 comments, the approvals and the records' metadata) in a tenant of its own, written in stages that
    # commit and are analysed before the next. MinutesVolumeIT measures the decisions list, recording a decision, a consent
    # section and a decision numbered after the meeting, the resolution register and its check, "My meetings" with the
    # minutes line, the minutes page, the reader's copy and a sweep pass with the minutes' steps; every statement's plan may
    # not scan a minutes table or a large meeting table sequentially. MinutesJobsVolumeIT runs the release at 60 decisions,
    # the draft, the copies and the 200-page record (on the fake document converter: the CI runner has no ONLYOFFICE).
    # Budgets have 2x headroom; the values and the plans are in the uploaded test reports. The two run in separate JVMs.
    name: Minutes at volume (MinutesVolumeIT, MinutesJobsVolumeIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: MinutesVolumeIT at 3,600 meetings
        env:
          MEETING_VOLUME: '3600'
        run: ./gradlew :backend:test --tests com.memo.minutes.MinutesVolumeIT --rerun --console=plain
      # The next Gradle run starts its test results afresh: keep this one's report.
      - if: always()
        run: mkdir -p build/minutes-volume && cp backend/build/test-results/test/TEST-com.memo.minutes.MinutesVolumeIT.xml build/minutes-volume/ || true
      # A JVM of its own: test contexts share the scheduler table, and the volume's context (no object storage) would pick up
      # the jobs test's renditions and fail them (the memos could then not be submitted).
      - name: MinutesJobsVolumeIT (60 decisions, a 200-page record)
        if: ${{ !cancelled() }}
        env:
          MEETING_VOLUME: '3600'
        run: ./gradlew :backend:test --tests com.memo.minutes.MinutesJobsVolumeIT --rerun --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minutes-volume-report
          path: |
            build/minutes-volume/TEST-com.memo.minutes.MinutesVolumeIT.xml
            backend/build/test-results/test/TEST-com.memo.minutes.MinutesJobsVolumeIT.xml
          retention-days: 30

  actions-volume:
    # Action items at the design's volume (Phase 4 E07 T9, design E07 §8): MeetingVolume's 3,600 meetings (with "Matters
    # arising" on every agenda) and about 29,000 actions over them in a tenant of their own, 3,400 open, 157,000 timeline
    # entries, 3,200 action taken reports with 220,000 rows, and 5,000 people with notices for the daily digest. The p95 of
    # "My actions" (each tab with its counts), the tracker (with and without text, with its totals) and its export, an action
    # with its timeline, the report (built and read, and its PDF), the writes (raise, issue one and a meeting's 30, update,
    # done, verify) and the daily task, against the budgets with 2x headroom for shared runners; and the plan of every
    # statement the reads and the daily task run, which may not scan an action table sequentially. The values and the
    # plans are in the uploaded test report.
    name: Actions at volume (ActionsVolumeIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: ActionsVolumeIT at 3,600 meetings
        env:
          ACTIONS_VOLUME: '3600'
        run: ./gradlew :backend:test --tests com.memo.actions.ActionsVolumeIT --rerun --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-volume-report
          path: backend/build/test-results/test/TEST-com.memo.actions.ActionsVolumeIT.xml
          retention-days: 30

  committee-volume:
    # The decision register and meeting analytics at the design's volume (Phase 4 E08 T5, design E08 §8): the committee
    # volume (MeetingVolume with E05's rows and the attendance histories, ActionsVolume, MinutesVolume, the register filled
    # by its backfill, the five reader profiles) in a tenant of its own, written in stages that commit and are analysed
    # before the next. RegisterVolumeIT measures the backfill, every profile's searches (newest first, one committee,
    # number order, words, a resolution number), the indexing a decision adds, an agenda's refresh and the exports at
    # their row limits, and explains the definer function's statement with each profile's own parameters (no sequential
    # scan of search_decision); AnalyticsVolumeIT the overview, a committee's detail and the attendance export. At 3,600
    # meetings (about 54,000 decisions) both, sharing one volume; at 7,200 (about 108,000) the register again, in a JVM of
    # its own (the volume's ids are global keys). Budgets have 2x headroom; the values and plans are in the test reports.
    name: Register and analytics at volume (RegisterVolumeIT, AnalyticsVolumeIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: RegisterVolumeIT and AnalyticsVolumeIT at 3,600 meetings (54,000 decisions)
        env:
          COMMITTEE_VOLUME: '3600'
        run: ./gradlew :backend:test --tests com.memo.search.RegisterVolumeIT --tests com.memo.analytics.AnalyticsVolumeIT --rerun --console=plain
      # The next Gradle run starts its test results afresh: keep this one's reports.
      - if: always()
        run: mkdir -p build/committee-volume && cp backend/build/test-results/test/TEST-com.memo.*VolumeIT.xml build/committee-volume/ || true
      - name: RegisterVolumeIT at 7,200 meetings (108,000 decisions)
        if: ${{ !cancelled() }}
        env:
          COMMITTEE_VOLUME: '7200'
        run: ./gradlew :backend:test --tests com.memo.search.RegisterVolumeIT --rerun --console=plain
      - if: always()
        run: mkdir -p build/committee-volume/7200 && cp backend/build/test-results/test/TEST-com.memo.search.RegisterVolumeIT.xml build/committee-volume/7200/ || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: committee-volume-report
          path: build/committee-volume/
          retention-days: 30

  committee-load:
    # The committee load (Phase 4 E08 T5, NFR P1, design E08 §8): CommitteeLoadSimulation at 50 people, ten in each of the
    # register's five reader profiles, searching the decision register, reading "My actions", their committee's action
    # tracker and the analytics, against the budgets (register 150 ms newest first and 300 ms with words for every profile,
    # "My actions" 150 ms, the tracker 200 ms, the overview 800 ms, a committee's detail 500 ms; under 1 % errors). The
    # committee volume is written by the backend's test-side generators, so the host is the backend test
    # CommitteeLoadHostIT (the application on port 18200 over the volume at 3,600 meetings), run in the same Gradle
    # invocation as the simulation (--parallel): the simulation waits for the host's ready file and tells it when it is
    # done. The people's password and TOTP secret are generated here and never printed.
    name: Committee load (CommitteeLoadSimulation)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Committee volume and the load simulation
        env:
          COMMITTEE_LOAD: 'true'
          COMMITTEE_VOLUME: '3600'
        run: |
          MEMO_LOAD_PASSWORD="load-$(openssl rand -hex 16)"
          MEMO_LOAD_TOTP_SECRET=$(openssl rand 20 | base32 | tr -d '=')
          echo "::add-mask::$MEMO_LOAD_PASSWORD"
          echo "::add-mask::$MEMO_LOAD_TOTP_SECRET"
          export MEMO_LOAD_PASSWORD MEMO_LOAD_TOTP_SECRET
          export COMMITTEE_LOAD_DIR="$GITHUB_WORKSPACE/build/committee-load"
          ./gradlew :backend:test --tests com.memo.analytics.CommitteeLoadHostIT --rerun \
            :perf:gatlingRun --simulation com.memo.perf.CommitteeLoadSimulation --parallel --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: committee-load-reports
          path: |
            perf/build/reports/gatling/
            backend/build/test-results/test/TEST-com.memo.analytics.CommitteeLoadHostIT.xml
          retention-days: 30
