# Phase 2 E04 assignees, routing rules and DoA (design E04 §5, §6). Task claims are the candidates' (the engine checks it);
# random task ids are 404 for everyone allowed through.
epic: P2-E04
endpoints:
  - { endpoint: "POST /api/v1/tasks/{taskId}/claim", rule: signedIn, headers: { Idempotency-Key: "{random}" } }
  - { endpoint: "POST /api/v1/tasks/{taskId}/release", rule: signedIn, headers: { Idempotency-Key: "{random}" } }
  - { endpoint: "POST /api/v1/admin/workflow/tasks/{taskId}/release", rule: tenantAdmin, headers: { Idempotency-Key: "{random}" } }
  - { endpoint: "GET /api/v1/admin/workflow/queues", rule: tenantAdmin }
  - endpoint: "POST /api/v1/admin/workflow/queues"
    rule: tenantAdmin
    body: { key: "matrix", name: "Matrix" }
  - endpoint: "PUT /api/v1/admin/workflow/queues/{key}"
    rule: tenantAdmin
    body: { name: "Matrix" }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/tasks/{taskId}/recuse"
    rule: signedIn
    body: { remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  # Declared interests: the memo initiator's (404 for memos the actor cannot see).
  - endpoint: "POST /api/v1/memos/{id}/interests"
    rule: signedIn
    body: { userId: "{random}", reason: "Matrix" }
  - { endpoint: "DELETE /api/v1/memos/{id}/interests/{userId}", rule: signedIn }
  # Substitutions (design E04 §4.5); random people are refused as a bad request, random ids are 404.
  - { endpoint: "GET /api/v1/admin/workflow/substitutions", rule: tenantAdmin }
  - endpoint: "POST /api/v1/admin/workflow/substitutions"
    rule: tenantAdmin
    body: { principalId: "{random}", substituteId: "{random}", validFrom: "2026-01-01" }
  - { endpoint: "POST /api/v1/admin/workflow/substitutions/{id}/end", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/workflow/substitutions/{id}/apply", rule: tenantAdminStepUp }
  # Delegation of authority (design E04 §3, §5): drafting under workflow.doa.manage, review under .approve (publishing
  # needs a step-up), reading and simulating under either. Unknown version numbers are 404.
  - { endpoint: "GET /api/v1/admin/workflow/doa", rule: tenantAdmin }
  - { endpoint: "GET /api/v1/admin/workflow/doa/versions/{number}", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/workflow/doa/versions", rule: tenantAdmin, body: { rules: [] } }
  - endpoint: "PUT /api/v1/admin/workflow/doa/versions/{number}"
    rule: tenantAdmin
    body: { rules: [] }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/admin/workflow/doa/versions/{number}/submit", rule: tenantAdmin, headers: { If-Match: "\"0\"" } }
  - { endpoint: "POST /api/v1/admin/workflow/doa/versions/{number}/approve", rule: tenantAdminStepUp }
  - endpoint: "POST /api/v1/admin/workflow/doa/versions/{number}/send-back"
    rule: tenantAdmin
    body: { remark: "Matrix" }
  - endpoint: "POST /api/v1/admin/workflow/doa/simulate"
    rule: tenantAdmin
    body: { subjectType: "memo", initiatorId: "{random}" }
  # The initiator's DoA preview (design E04 §4.7): memos the actor cannot see are 404.
  - { endpoint: "POST /api/v1/memos/{id}/doa-preview", rule: signedIn }
