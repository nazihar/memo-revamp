# Defaults are safe for any environment; secrets come only from the environment (never from this file).
spring:
  application:
    name: memo
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  autoconfigure:
    # No default in-memory user with a logged password; identities arrive in Phase 1a.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${MEMO_DB_URL:jdbc:postgresql://localhost:5432/memo}
    username: ${MEMO_DB_APP_USER:memo_app}
    password: ${MEMO_DB_APP_PASSWORD:}
    hikari:
      connection-timeout: 5000 # ms
      maximum-pool-size: 10
  flyway:
    # Deployed app instances set MEMO_FLYWAY_ENABLED=false: migrations run in the separate migrate job (ADR-0016).
    enabled: ${MEMO_FLYWAY_ENABLED:true}
    # Migrations run as the schema owner; the application connects as memo_app (AGENTS.md §3.2).
    user: ${MEMO_DB_MIGRATOR_USER:memo_migrator}
    password: ${MEMO_DB_MIGRATOR_PASSWORD:}
    schemas: memo
    default-schema: memo
    create-schemas: false
    # Spring Modulith runs db/migration/__root, then db/migration/<module> in module dependency order (ADR-0007).
  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      flyway-enabled: true
    # Transactional outbox (ADR-0019, research §R6). Tables come from Flyway (system/V3); the app role has no DDL.
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: archive
      # Never on restart (several instances); OutboxMaintenance resubmits failed publications once per cluster.
      republish-outstanding-events-on-restart: false
      staleness:
        published: PT5M
        processing: PT5M
  jooq:
    sql-dialect: postgres
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  # Sessions in PostgreSQL (ADR-0023). The schema is a Flyway migration; cleanup runs as a db-scheduler task.
  session:
    timeout: 30m
    jdbc:
      table-name: identity_http_session
      initialize-schema: never
      cleanup-cron: "-"

# Background jobs (ADR-0018).
db-scheduler:
  enabled: ${MEMO_JOBS_ENABLED:true}
  table-name: system_scheduled_task
  # Not lock-and-fetch: db-scheduler issue #933 on PostgreSQL.
  polling-strategy: fetch
  threads: 10
  delay-startup-until-context-ready: true
  always-persist-timestamp-in-utc: true

# Operability baseline (ADR-0016). Structured JSON logs are switched on by the deployment manifests
# (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs); local dev and tests keep readable text.
management:
  server:
    # Probes and metrics live on a separate port that is never exposed through the web proxy.
    port: ${MEMO_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        # tenanthost: Caddy on-demand TLS ask check (ADR-0022), management port only.
        include: health, tenanthost
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db
  # OpenTelemetry is wired but exports nothing unless an environment enables it (no collector required).
  tracing:
    export:
      enabled: ${MEMO_OTEL_EXPORT:false}
  otlp:
    tracing:
      export:
        enabled: ${MEMO_OTEL_EXPORT:false}
    logging:
      export:
        enabled: ${MEMO_OTEL_EXPORT:false}
    metrics:
      export:
        enabled: ${MEMO_OTEL_EXPORT:false}

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      # The session cookie is configured in SessionConfig (ADR-0023).
      tracking-modes: []
  # Client address and host from X-Forwarded-* only when the immediate peer is a trusted proxy (Tomcat RemoteIpValve;
  # private address ranges by default, override with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES). Per-IP rate limits and
  # tenant resolution depend on it (ADR-0022, ADR-0025).
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: ${memo.api-docs.enabled}
    version: openapi_3_1
  swagger-ui:
    enabled: false

memo:
  # Tenant resolution from the request host (ADR-0022).
  tenancy:
    mode: ${MEMO_TENANCY_MODE:multi}
    base-domain: ${MEMO_TENANCY_BASE_DOMAIN:localhost}
    single-tenant: ${MEMO_TENANCY_SINGLE_TENANT:}
    # Tenant for the bare base domain (local dev, the dev VM); empty in production.
    fallback-tenant: ${MEMO_TENANCY_FALLBACK_TENANT:}
  # app (default) | migrate: run the Modulith Flyway migrations as memo_migrator, then exit (ADR-0016).
  mode: ${MEMO_MODE:app}
  demo:
    # Seeds the demo tenant on startup (dev and test only; refuses under the prod profile).
    seed: ${MEMO_DEMO_SEED:false}
    # Password of the demo users (generated into the git-ignored .env; empty: they cannot sign in).
    password: ${MEMO_DEMO_PASSWORD:}
  security:
    # argon2 (default) | pbkdf2 (FIPS-approved algorithms only) (ADR-0023).
    password-encoding: ${MEMO_PASSWORD_ENCODING:argon2}
    # Optional directory of Have I Been Pwned range files for the full breached-password check.
    breached-passwords-dir: ${MEMO_BREACHED_PASSWORDS_DIR:}
    # Secure cookies; only plain-HTTP test setups switch this off (browsers accept Secure on http://localhost).
    cookie-secure: ${MEMO_COOKIE_SECURE:true}
  api-docs:
    enabled: false
  health:
    cache-ttl: 5s
    probe-timeout: 2s
  storage:
    endpoint: ${MEMO_S3_ENDPOINT:}
    region: ${MEMO_S3_REGION:us-east-1}
    access-key: ${MEMO_S3_ACCESS_KEY:}
    secret-key: ${MEMO_S3_SECRET_KEY:}
    records-bucket: records
    work-bucket: work
  document-server:
    url: ${MEMO_DOCSERVER_URL:}
  malware-scanner:
    host: ${MEMO_CLAMAV_HOST:}
    port: ${MEMO_CLAMAV_PORT:3310}
  mail:
    host: ${MEMO_SMTP_HOST:}
    port: ${MEMO_SMTP_PORT:25}

---
spring:
  config:
    activate:
      on-profile: dev
memo:
  api-docs:
    enabled: true
