# Phase 3 E06 legacy import (design E06 §10; ADR-0055). memo.import is granted on purpose: no subject of the matrix holds
# it, so every signed-in subject is 403 before anything is read. Readers without the permission are 403, holders who
# cannot read the memo 404, and holders without a fresh step-up 401 (LegacyCorrectionIT). The batch endpoints' allowed
# paths, and the uploads of the three purposes (imports.source, imports.intake, imports.record: 403 without the
# permission or for a batch that moved on), are in ImportBatchIT; the dry run's and the mappings' in DryRunIT and
# MappingIT; POST /files itself is in e05-files.yaml.
epic: P3-E06
endpoints:
  - endpoint: "POST /api/v1/memos/{id}/legacy/corrections"
    rule: signedIn
    body: { field: "SUBJECT", value: "Matrix", reason: "Matrix" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/memos/{id}/legacy/reclassify"
    rule: signedIn
    body: { classificationId: "{random}", reason: "Matrix" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  # Batches and their intake (T5).
  - endpoint: "GET /api/v1/admin/imports"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/admin/imports"
    rule: signedIn
    headers: { Idempotency-Key: "{random}" }
    body: { name: "Matrix", sourceCode: "MATRIX", timeZone: "UTC" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "GET /api/v1/admin/imports/{id}"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "PUT /api/v1/admin/imports/{id}"
    rule: signedIn
    headers: { If-Match: "\"0\"" }
    body: { name: "Matrix", sourceCode: "MATRIX", timeZone: "UTC" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "GET /api/v1/admin/imports/template"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/admin/imports/{id}/files"
    rule: signedIn
    body: { files: [{ path: "matrix.pdf", size: 1 }] }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "GET /api/v1/admin/imports/{id}/files"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  # The dry run, its problems and rows, and the mappings (T6).
  - endpoint: "POST /api/v1/admin/imports/{id}/dry-run"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "GET /api/v1/admin/imports/{id}/problems"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "GET /api/v1/admin/imports/{id}/rows"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "GET /api/v1/admin/imports/{id}/mappings"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "PUT /api/v1/admin/imports/{id}/mappings/{kind}"
    rule: signedIn
    headers: { If-Match: "\"0\"" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  # The import: start and resume need a fresh step-up as well (T7). Their allowed paths, step-up and clearance refusals,
  # one running import per tenant and the cross-tenant 404s are in ImportRunIT and ImportConcurrencyIT.
  - endpoint: "POST /api/v1/admin/imports/{id}/start"
    rule: signedIn
    headers: { If-Match: "\"0\"" }
    body: { expectedRows: 1 }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/admin/imports/{id}/stop"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/admin/imports/{id}/resume"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/admin/imports/{id}/finish"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  # Verification, the report and closing (T8). The report is for memo.import or audit.read holders cleared to the batch's
  # highest level: the tenant administrator holds audit.read, so a random id is 404 for them. Close and abandon need
  # memo.import. Their allowed paths, the clearance refusals and the cross-tenant 404s are in ReconciliationIT and
  # ImportCloseIT.
  - endpoint: "GET /api/v1/admin/imports/{id}/report"
    rule: signedIn
    expect: { user: 403, tenantAdmin: 404, tenantAdminStale: 404 }
  - endpoint: "POST /api/v1/admin/imports/{id}/close"
    rule: signedIn
    body: { reason: "Matrix" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
  - endpoint: "POST /api/v1/admin/imports/{id}/abandon"
    rule: signedIn
    body: { reason: "Matrix" }
    expect: { user: 403, tenantAdmin: 403, tenantAdminStale: 403 }
