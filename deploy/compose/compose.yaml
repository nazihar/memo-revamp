# Local development stack (ADR-0003, ADR-0005). Not for production; the on-prem profile lives in deploy/compose/onprem (E05).
# Profiles: core = postgres, seaweedfs, mailpit (+ storage-init); full = core + onlyoffice + clamav.
# Credentials come from .env, generated by `pnpm stack:up` (scripts/dev.mjs). Never commit .env.
name: memo-local  # distinct from the VM environments (memo-dev, memo-staging) deployed by deploy.sh

services:
  postgres:
    image: postgres:18.6
    profiles: [core, full]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run pnpm stack:up to generate .env}
      POSTGRES_DB: memo
      MEMO_MIGRATOR_PASSWORD: ${MEMO_MIGRATOR_PASSWORD:?}
      MEMO_APP_PASSWORD: ${MEMO_APP_PASSWORD:?}
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memo"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [core, full]
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?}
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:?}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:?}
      # Bump when the identities in start.sh change: a changed value recreates the container so they reload.
      S3_IDENTITIES_REVISION: "2"
    entrypoint: ["/bin/sh", "/seaweedfs/start.sh"]
    volumes:
      - ../seaweedfs/start.sh:/seaweedfs/start.sh:ro
      - seaweed:/data
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  storage-init:
    image: amazon/aws-cli:2.37.13
    profiles: [core, full]
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://seaweedfs:8333
    entrypoint: ["/bin/sh", "/init/storage-init.sh"]
    volumes:
      - ../seaweedfs/storage-init.sh:/init/storage-init.sh:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: [core, full]
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    profiles: [full]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?}
      JWT_HEADER: Authorization
    # No outbound network (AGENTS.md §3.4): attached only to an internal network shared with the backend proxy.
    networks: [docs-internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 60

  # Gives the host-run backend a route to the internal-only ONLYOFFICE network, and nothing else.
  onlyoffice-gateway:
    image: alpine/socat:1.8.1.1
    profiles: [full]
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:onlyoffice:80"]
    networks: [default, docs-internal]
    ports: ["127.0.0.1:8081:8081"]

  clamav:
    image: clamav/clamav:1.5.4
    profiles: [full]
    ports: ["127.0.0.1:3310:3310"]
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40

networks:
  default: {}
  docs-internal:
    internal: true

volumes:
  pgdata: {}
  seaweed: {}
  clamav: {}
