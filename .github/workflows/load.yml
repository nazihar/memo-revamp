name: load

# Weekly load stage (TESTING_STRATEGY §7, phase 2 overview E05): synthetic volume V2 (10,000 memos in review with
# their SLA timers) on the on-prem stack, then the Gatling inbox simulation against it (NFR P1: p95 < 300 ms).
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      instances:
        description: Memos in review to generate
        default: '10000'

permissions:
  contents: read

concurrency:
  group: load
  cancel-in-progress: false

jobs:
  inbox-v2:
    name: Volume V2 + Gatling inbox (on-prem stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: ./gradlew :backend:bootJar --console=plain
      - name: Build images and start the on-prem stack with volume V2
        env:
          MEMO_VOLUME_V2: 'true'
          MEMO_VOLUME_INSTANCES: ${{ inputs.instances || '10000' }}
        run: |
          pnpm install --frozen-lockfile && pnpm --filter web build
          docker build -f backend/Dockerfile -t memo-backend:load .
          docker build -f web/Dockerfile -t memo-web:load .
          ci/onprem-stack.sh up memo-backend:load memo-web:load 18100
      - name: Wait for volume V2
        run: |
          # Progress once a minute (the generator logs every 500 memos), so a slow or stuck run shows where it is.
          for i in $(seq 1 600); do
            logs=$(docker compose -p memo-nightly logs backend 2>/dev/null)
            if grep -q 'Volume V2 ready' <<<"$logs"; then grep -o 'Volume V2 ready[^"]*' <<<"$logs"; exit 0; fi
            if [ $((i % 6)) -eq 0 ]; then echo "$(date -u +%H:%M) $(grep -o 'Volume V2: [^"]*' <<<"$logs" | tail -1)"; fi
            sleep 10
          done
          exit 1
      - if: failure()
        name: Backend log
        run: |
          mkdir -p perf/build/reports/gatling
          docker compose -p memo-nightly logs --no-color backend > perf/build/reports/gatling/backend.log 2>&1 || true
          grep -E '"level":"(WARN|ERROR)"' perf/build/reports/gatling/backend.log | tail -40 >&2 || true
      - name: Inbox load
        run: |
          # The volume users' password, generated into the stack's .env; never printed.
          MEMO_DEMO_PASSWORD=$(grep '^MEMO_DEMO_PASSWORD=' build/onprem-stack/.env | cut -d= -f2-)
          export MEMO_DEMO_PASSWORD
          ./gradlew :perf:gatlingRun --simulation com.memo.perf.InboxLoadSimulation -DbaseUrl=http://127.0.0.1:18100 --console=plain
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-reports
          path: perf/build/reports/gatling/
          retention-days: 30
      - if: always()
        run: ci/onprem-stack.sh down
