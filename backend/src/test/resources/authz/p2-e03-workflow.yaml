# Phase 2 E03 workflow definitions and runtime (design E03 §5, §6). Task actions are the holder's (the engine checks it);
# tasks of memos the actor cannot see are 404 like the memo, so the random ids here are 404 for everyone allowed through.
# The per-holder behaviour (holder, other participants, strangers) is TaskActionsIT and the memo journey tests.
epic: P2-E03
endpoints:
  - endpoint: "POST /api/v1/tasks/{taskId}/send-back"
    rule: signedIn
    body: { targetStepId: "{random}", remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/tasks/{taskId}/forward"
    rule: signedIn
    body: { to: "{random}", remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/tasks/{taskId}/delegate"
    rule: signedIn
    body: { to: "{random}", remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/tasks/{taskId}/ask"
    rule: signedIn
    body: { to: "{random}", remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/tasks/{taskId}/answer"
    rule: signedIn
    body: { remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/tasks/{taskId}/refer"
    rule: signedIn
    body: { to: ["{random}"], remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/tasks/{taskId}/opinion"
    rule: signedIn
    body: { remark: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  # Round control (T6): recall is the initiator's (404 for memos the actor cannot see); cancel is privileged with step-up.
  - { endpoint: "POST /api/v1/memos/{id}/recall", rule: signedIn, headers: { Idempotency-Key: "{random}" } }
  - endpoint: "POST /api/v1/admin/workflow/instances/{instanceId}/cancel"
    rule: tenantAdminStepUp
    body: { reason: "Matrix" }
    headers: { Idempotency-Key: "{random}" }
  # Definition lifecycle (T7): reading needs workflow.definitions.manage or .approve; authoring .manage; deciding .approve,
  # approving and retiring after a fresh step-up. Unknown keys and version numbers are 404 for those allowed through.
  - { endpoint: "GET /api/v1/admin/workflow-definitions", rule: tenantAdmin }
  - endpoint: "POST /api/v1/admin/workflow-definitions"
    rule: tenantAdmin
    body: { key: "matrix", name: "Matrix", body: { schemaVersion: 2 } }
  - { endpoint: "GET /api/v1/admin/workflow-definitions/{key}", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/workflow-definitions/{key}/versions", rule: tenantAdmin }
  - { endpoint: "GET /api/v1/admin/workflow-definitions/{key}/versions/{number}", rule: tenantAdmin }
  - endpoint: "PUT /api/v1/admin/workflow-definitions/{key}/versions/{number}"
    rule: tenantAdmin
    body: { body: { schemaVersion: 2 } }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/admin/workflow-definitions/{key}/versions/{number}/validate", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/workflow-definitions/{key}/versions/{number}/submit", rule: tenantAdmin, headers: { If-Match: "\"0\"" } }
  - { endpoint: "POST /api/v1/admin/workflow-definitions/{key}/versions/{number}/approve", rule: tenantAdminStepUp }
  - endpoint: "POST /api/v1/admin/workflow-definitions/{key}/versions/{number}/send-back"
    rule: tenantAdmin
    body: { remark: "Matrix" }
  - { endpoint: "POST /api/v1/admin/workflow-definitions/{key}/versions/{number}/retire", rule: tenantAdminStepUp }
  - { endpoint: "GET /api/v1/admin/workflow-definitions/{key}/versions/{number}/export", rule: tenantAdmin }
  # In-flight migration (T8): workflow.definitions.approve; migrating needs a fresh step-up. Unknown keys are 404.
  - { endpoint: "POST /api/v1/admin/workflow-definitions/{key}/migrations/preview", rule: tenantAdmin }
  - endpoint: "POST /api/v1/admin/workflow-definitions/{key}/migrations"
    rule: tenantAdminStepUp
    body: { instanceIds: ["{random}"] }
    headers: { Idempotency-Key: "{random}" }
  # Memo types choose among the published definitions (T10).
  - { endpoint: "GET /api/v1/admin/memo-types/definitions", rule: tenantAdmin }
