# Email templates (ADR-0030), Arabic: proves right-to-left rendering (Phase 1a Q8). Same keys as messages.properties.
mail.INVITATION.subject=دعوة إلى memo
mail.INVITATION.body=مرحبًا {name}،\n\nدعاك {inviter} للانضمام إلى {organisation} على memo. عيّن كلمة المرور وابدأ من هنا:\n\n{link}\n\nيعمل الرابط مرة واحدة وتنتهي صلاحيته بعد 7 أيام. إذا لم تكن تتوقع هذه الدعوة فيمكنك تجاهل هذه الرسالة.
mail.PASSWORD_RESET.subject=إعادة تعيين كلمة مرور memo
mail.PASSWORD_RESET.body=مرحبًا {name}،\n\nطلب أحدهم إعادة تعيين كلمة مرورك في {organisation} على memo. اختر كلمة مرور جديدة من هنا:\n\n{link}\n\nيعمل الرابط مرة واحدة وتنتهي صلاحيته بعد 30 دقيقة. إذا لم تكن أنت فتجاهل هذه الرسالة وستبقى كلمة مرورك كما هي.
mail.PASSWORD_CHANGED.subject=تم تغيير كلمة مرور memo
mail.PASSWORD_CHANGED.body=مرحبًا {name}،\n\nتم للتو تغيير كلمة مرور حسابك في {organisation}، وتم تسجيل الخروج من جلساتك الأخرى.\n\nإذا لم تكن أنت فاتصل بالمسؤول الآن.
mail.MFA_RESET.subject=تمت إعادة تعيين تسجيل الدخول إلى memo
mail.MFA_RESET.body=مرحبًا {name}،\n\nأعاد مسؤول في {organisation} تعيين التحقق بخطوتين لحسابك. ستُعِد تطبيق المصادقة من جديد عند تسجيل دخولك القادم.\n\nإذا لم تكن تتوقع ذلك فاتصل بالمسؤول.
mail.SIGN_IN_ALERT.subject=تسجيل دخول جديد إلى memo
mail.SIGN_IN_ALERT.body=مرحبًا {name}،\n\nتم تسجيل الدخول إلى حسابك في {organisation} من جهاز جديد:\n\n{device}\n{time} (UTC)\n\nإذا لم تكن أنت فغيّر كلمة مرورك واتصل بالمسؤول.
mail.ROLE_GRANTED.subject=تغيّرت صلاحياتك في memo
mail.ROLE_GRANTED.body=مرحبًا {name}،\n\nمُنحت الدور {role} في {organisation}. يسري ذلك عند فتحك memo في المرة القادمة.\n\nإذا لم تكن تتوقع ذلك فاتصل بالمسؤول.
mail.TEST.subject=رسالة اختبار من memo
mail.TEST.body=مرحبًا {name}،\n\nوصلت رسالة الاختبار هذه من {organisation} على memo عبر خادم البريد المضبوط. لا يلزم أي إجراء.
mail.TASK_ASSIGNED.subject=مذكرة بانتظار موافقتك
mail.TASK_ASSIGNED.body=مرحبًا {name}،\n\n{memo} {reference} في {organisation} بانتظار موافقتك. افتحها من هنا:\n\n{link}
mail.MEMO_RETURNED.subject=أُعيدت إليك مذكرة
mail.MEMO_RETURNED.body=مرحبًا {name}،\n\nأُعيدت إليك {memo} {reference} في {organisation}. افتحها لقراءة الملاحظة:\n\n{link}
mail.MEMO_REJECTED.subject=رُفضت مذكرة
mail.MEMO_REJECTED.body=مرحبًا {name}،\n\nرُفضت {memo} {reference} في {organisation}. افتحها لقراءة الملاحظة:\n\n{link}
mail.MEMO_APPROVED.subject=تمت الموافقة على مذكرتك
mail.MEMO_APPROVED.body=مرحبًا {name}،\n\nوافق جميع من في مسار {memo} {reference} في {organisation}:\n\n{link}
mail.TASK_REASSIGNED.subject=أُعيد إسناد مهمة مذكرة
mail.TASK_REASSIGNED.body=مرحبًا {name}،\n\nأعاد مسؤول في {organisation} إسناد الموافقة على {memo} {reference}. افتحها لمعرفة من يتولاها الآن:\n\n{link}
mail.TASK_BLOCKED.subject=مذكرة بانتظار إعادة الإسناد
mail.TASK_BLOCKED.body=مرحبًا {name}،\n\nلا يستطيع المعتمد التالي لـ{memo} {reference} في {organisation} التصرف فيها حاليًا. يجب أن يسند مسؤول المهمة إلى شخص آخر:\n\n{link}
mail.MEMO_WITHDRAWN.subject=سُحبت مذكرة كنت تراجعها
mail.MEMO_WITHDRAWN.body=مرحبًا {name}،\n\nسحب منشئ {memo} {reference} في {organisation} هذه المذكرة. لا يلزمك أي إجراء.\n\n{link}
mail.MEMO_UPDATE.subject=مستجدات بشأن مذكرة
mail.MEMO_UPDATE.body=مرحبًا {name}،\n\nبلغت {memo} {reference} في {organisation} خطوة تُبقيك على اطلاع. افتحها لمعرفة مرحلتها الحالية:\n\n{link}
mail.TASK_REMINDER.subject=تذكير: مذكرة بانتظارك
mail.TASK_REMINDER.body=مرحبًا {name}،\n\n{memo} {reference} في {organisation} بانتظار قرارك. افتحها لمعرفة موعدها النهائي:\n\n{link}
mail.TASK_OVERDUE.subject=مذكرة تجاوزت موعدها
mail.TASK_OVERDUE.body=مرحبًا {name}،\n\nتجاوزت الخطوة الحالية لـ{memo} {reference} في {organisation} موعدها النهائي. افتحها لمعرفة من يتولاها:\n\n{link}
mail.footer=أُرسلت هذه الرسالة من memo. لا ترد عليها.

# Default terms (ADR-0032): {unit}, {units}, {position}, {positions}, {memo}, {memos} in templates; tenants may override.
term.unit.one=وحدة
term.unit.other=وحدات
term.position.one=وظيفة
term.position.other=وظائف
term.memo.one=مذكرة
term.memo.other=مذكرات
