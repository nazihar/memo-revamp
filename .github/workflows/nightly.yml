# Nightly stage (TESTING_STRATEGY §9, ADR-0011): heavier suites, ≤ 2 h. Jobs whose content arrives in later phases are
# present as runnable placeholders so the stage structure is complete from Phase 0 (they print what will run there).
name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.75.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      # Long property runs: jqwik tries ×20 (JQWIK_DEFAULT_TRIES is read by jqwik.properties in later phases).
      - run: ./gradlew :backend:bootJar :backend:test -Djqwik.tries.default=1000 --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jar
          path: backend/build/libs/backend.jar
          retention-days: 3

  e2e-full:
    name: e2e (Firefox, WebKit, pseudo-locale, visual)
    needs: build
    runs-on: ubuntu-24.04
    container:
      # Same image as the visual baselines (web/e2e/README.md), so screenshots match.
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      # Visual + pseudo mock the API, so they need no backend; Firefox/WebKit smoke runs against a mocked-free stack
      # in Phase 1a when the e2e stack moves into a reusable service container. Until then they use the preview build.
      - run: pnpm --filter web exec playwright test --project=visual --project=pseudo --retries=1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-playwright-report
          path: web/playwright-report/
          retention-days: 14

  cross-browser:
    name: e2e smoke on Firefox + WebKit (real stack)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: backend/build/libs
      - run: ci/e2e-stack.sh start
      - run: pnpm --filter web exec playwright install --with-deps firefox webkit
      - run: pnpm --filter web exec playwright test --project=firefox --project=webkit --retries=1
      - if: always()
        run: ci/e2e-stack.sh logs

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: pnpm --filter web lhci

  security-daily:
    name: daily dependency + image re-scan (new CVEs against unchanged code)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (lockfiles)
        run: |
          docker run --rm -v "$PWD:/src" "aquasec/trivy:$TRIVY_VERSION" fs --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore --exit-code 1 /src

  later-phase-placeholders:
    name: placeholders (mutation · Schemathesis · upgrade/N-1 · ZAP · Gatling)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "PIT mutation testing: starts with workflow/authz/audit modules (Phase 1a/2)."
          echo "Schemathesis API fuzzing: starts when the first mutating endpoints exist (Phase 1a)."
          echo "Upgrade + N-1 migration tests: start with the first deployed release (E05/Phase 1a)."
          echo "ZAP baseline + Gatling smoke against dev: wired in E05."
