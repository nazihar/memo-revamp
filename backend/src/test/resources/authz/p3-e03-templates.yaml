# Phase 3 E03 templates (design E03 §3, §7; ADR-0048) and shares (§5; ADR-0050). Rules: rules.yaml. memo.types.manage and memo.types.approve are
# privileged and held by tenant admins; reviewers may read a template, only makers preview or remove it (MemoTemplatesIT).
# Random type ids are 404 for everyone allowed through. Filling a memo's document follows the memo: unknown memos are 404.
epic: P3-E03
endpoints:
  - { endpoint: "GET /api/v1/admin/memo-types/{typeId}/versions/{number}/template", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/memo-types/{typeId}/versions/{number}/template/preview", rule: tenantAdmin }
  - { endpoint: "DELETE /api/v1/admin/memo-types/{typeId}/versions/{number}/template", rule: tenantAdmin, headers: { If-Match: "\"0\"" } }
  - { endpoint: "POST /api/v1/memos/{id}/document/from-template", rule: signedIn }
  # Shares follow the memo: unknown memos are 404 for every signed-in user.
  - { endpoint: "GET /api/v1/memos/{id}/shares", rule: signedIn }
  - endpoint: "POST /api/v1/memos/{id}/shares"
    rule: signedIn
    body: { userId: "{random}", reason: "Matrix" }
  - { endpoint: "DELETE /api/v1/memos/{id}/shares/{shareId}", rule: signedIn }
  # Copy-to and receipts follow the memo (§5): unknown memos are 404 for every signed-in user.
  - { endpoint: "GET /api/v1/memos/{id}/copies", rule: signedIn }
  - { endpoint: "PUT /api/v1/memos/{id}/copies", rule: signedIn, body: { copies: [] }, headers: { If-Match: "\"0\"" } }
  - { endpoint: "POST /api/v1/memos/{id}/copies/additions", rule: signedIn, body: { copies: [] } }
  - { endpoint: "GET /api/v1/memos/{id}/receipts", rule: signedIn }
  # Distribution lists: everyone reads them to pick recipients (random ids are 404); memo.distribution.manage keeps them.
  - { endpoint: "GET /api/v1/distribution-lists", rule: signedIn }
  - { endpoint: "GET /api/v1/distribution-lists/{id}", rule: signedIn }
  - { endpoint: "POST /api/v1/distribution-lists", rule: tenantAdmin, body: { name: "Matrix {random}", members: [] } }
  - endpoint: "PUT /api/v1/distribution-lists/{id}"
    rule: tenantAdmin
    body: { name: "Matrix", members: [] }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "DELETE /api/v1/distribution-lists/{id}", rule: tenantAdmin, headers: { If-Match: "\"0\"" } }
  # The note sheet (§4) follows the memo: unknown memos are 404 for every signed-in user.
  - { endpoint: "GET /api/v1/memos/{id}/notes", rule: signedIn }
  - endpoint: "POST /api/v1/memos/{id}/notes"
    rule: signedIn
    body: { body: { type: "doc", content: [ { type: "paragraph", content: [ { type: "text", text: "Matrix" } ] } ] } }
  - { endpoint: "GET /api/v1/memos/{id}/notes/draft", rule: signedIn }
  - { endpoint: "PUT /api/v1/memos/{id}/notes/draft", rule: signedIn, body: { body: { type: "doc", content: [] } } }
  - { endpoint: "DELETE /api/v1/memos/{id}/notes/draft", rule: signedIn }
  # Authenticated approvals (§6): stamps and their check follow the memo; unknown memos are 404.
  - { endpoint: "GET /api/v1/memos/{id}/approvals", rule: signedIn }
  - { endpoint: "POST /api/v1/memos/{id}/approvals/check", rule: signedIn }
