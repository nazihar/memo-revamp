# Email templates (ADR-0030), English. {name} placeholders are filled from the template's parameters; subjects take
# none and never carry sensitive content (AGENTS.md section 3.4). Keep every key in every language file.
mail.INVITATION.subject=You are invited to memo
mail.INVITATION.body=Hello {name},\n\n{inviter} invited you to {organisation} on memo. Set your password and get started:\n\n{link}\n\nThe link works once and expires in 7 days. If you did not expect this invitation, you can ignore this email.
mail.PASSWORD_RESET.subject=Reset your memo password
mail.PASSWORD_RESET.body=Hello {name},\n\nSomeone asked to reset your password for {organisation} on memo. Choose a new one here:\n\n{link}\n\nThe link works once and expires in 30 minutes. If it was not you, ignore this email: your password stays as it is.
mail.PASSWORD_CHANGED.subject=Your memo password was changed
mail.PASSWORD_CHANGED.body=Hello {name},\n\nThe password of your account at {organisation} was just changed, and your other sessions were signed out.\n\nIf this was not you, contact your administrator now.
mail.MFA_RESET.subject=Your memo sign-in was reset
mail.MFA_RESET.body=Hello {name},\n\nAn administrator at {organisation} reset your two-step sign-in. You will set up your authenticator app again the next time you sign in.\n\nIf you did not expect this, contact your administrator.
mail.SIGN_IN_ALERT.subject=New sign-in to memo
mail.SIGN_IN_ALERT.body=Hello {name},\n\nYour account at {organisation} was signed in to from a new device:\n\n{device}\n{time} (UTC)\n\nIf this was not you, change your password and contact your administrator.
mail.ROLE_GRANTED.subject=Your access in memo changed
mail.ROLE_GRANTED.body=Hello {name},\n\nYou were given the role {role} at {organisation}. It takes effect the next time you open memo.\n\nIf you did not expect this, contact your administrator.
mail.TEST.subject=memo test email
mail.TEST.body=Hello {name},\n\nThis test email from {organisation} on memo came through the configured mail relay. No action is needed.
mail.footer=This message was sent by memo. Do not reply to it.

# Default terms (ADR-0032): {unit}, {units}, {position}, {positions}, {memo}, {memos} in templates; tenants may override.
term.unit.one=unit
term.unit.other=units
term.position.one=position
term.position.other=positions
term.memo.one=memo
term.memo.other=memos
