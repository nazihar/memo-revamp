# Phase 4 E03 T2 the agenda draft and T3 publishing (design E03 §3, §4; ADR-0060, ADR-0061). Meeting, section, item and paper ids are
# random here, so every subject allowed through is answered 404 before the officer check. Who may do what on a real
# agenda (the committee's secretary, the chair reading only, forums.manage, a member, a user without a role) is
# AgendaBuilderIT and AgendaPlacementIT; two secretaries at once AgendaConcurrencyIT; another tenant MeetingCrossTenantIT.
epic: P4-E03
endpoints:
  - { endpoint: "GET /api/v1/forums/{forumId}/submissions/ready", rule: signedIn }
  - { endpoint: "GET /api/v1/meetings/{meetingId}/agenda/draft", rule: signedIn }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda"
    rule: signedIn
    body: { from: "TEMPLATE" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/sections"
    rule: signedIn
    body: { title: "Strategy" }
    headers: { If-Match: "\"0\"", Idempotency-Key: "{random}" }
  - endpoint: "PATCH /api/v1/meetings/{meetingId}/agenda/sections/{sectionId}"
    rule: signedIn
    body: { title: "Strategy" }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/meetings/{meetingId}/agenda/sections/{sectionId}/remove", rule: signedIn, headers: { If-Match: "\"0\"" } }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/moves"
    rule: signedIn
    body: { itemId: "{random}", toPosition: 0 }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/items"
    rule: signedIn
    body: { kind: "ITEM", title: "Strategy update" }
    headers: { If-Match: "\"0\"", Idempotency-Key: "{random}" }
  - endpoint: "PATCH /api/v1/meetings/{meetingId}/agenda/items/{itemId}"
    rule: signedIn
    body: { title: "Strategy update" }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/meetings/{meetingId}/agenda/items/{itemId}/remove", rule: signedIn, headers: { If-Match: "\"0\"" } }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/items/{itemId}/papers"
    rule: signedIn
    body: { fileId: "{random}" }
    headers: { If-Match: "\"0\"", Idempotency-Key: "{random}" }
  - endpoint: "PATCH /api/v1/meetings/{meetingId}/agenda/papers/{paperId}"
    rule: signedIn
    body: { title: "Valuation", classificationId: "{random}" }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/meetings/{meetingId}/agenda/papers/{paperId}/remove", rule: signedIn, headers: { If-Match: "\"0\"" } }
  # T3: the chair's part and publishing (design E03 §1.3, §1.4). Who may agree, decide and publish on a real agenda is
  # AgendaPublishIT; the notifications AgendaNotificationsIT; numbers MeetingNumberConcurrencyIT.
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/chair-agreement"
    rule: signedIn
    body: { onBehalf: false }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/chair-comments"
    rule: signedIn
    body: { text: "Please add the liquidity paper" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/items/{itemId}/late-decision"
    rule: signedIn
    body: { agree: true }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/papers/{paperId}/late-decision"
    rule: signedIn
    body: { agree: true }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "GET /api/v1/meetings/{meetingId}/agenda/publish-preview", rule: signedIn }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/publish"
    rule: signedIn
    body: { notify: true }
    headers: { If-Match: "\"0\"", Idempotency-Key: "{random}" }
  # T4: the agenda as its audience reads it, paper opens, the preview and consent requests (ADR-0061, design E03 §1.5,
  # §1.9). Who sees which line and paper on a real agenda is PaperAccessIT (with every surface of PaperSurfaceRegistry),
  # paper content PaperServingIT, "What changed" WhatChangedIT and the requests ConsentRequestIT.
  - { endpoint: "GET /api/v1/meetings/{meetingId}/agenda", rule: signedIn }
  - { endpoint: "GET /api/v1/meetings/{meetingId}/agenda/revisions", rule: signedIn }
  - { endpoint: "POST /api/v1/meetings/{meetingId}/seen", rule: signedIn, body: { revision: 1 } }
  - { endpoint: "GET /api/v1/meetings/{meetingId}/agenda/preview", rule: signedIn }
  - { endpoint: "GET /api/v1/meetings/{meetingId}/papers/{paperId}/content", rule: signedIn }
  - endpoint: "POST /api/v1/meetings/{meetingId}/agenda/items/{itemId}/discussion-requests"
    rule: signedIn
    headers: { Idempotency-Key: "{random}" }
  - { endpoint: "POST /api/v1/meetings/{meetingId}/agenda/items/{itemId}/discussion-requests/mine/withdraw", rule: signedIn }
