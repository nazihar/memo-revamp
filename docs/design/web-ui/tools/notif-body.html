    <main style="flex: 1; padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
      <div style="width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 16px">

        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Notifications</h1>
            <p style="margin: 0; font-size: 14px; color: var(--muted-fg)">What happened to your account and your work.</p>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <button type="button" class="ghost" onClick="{{markAll}}" disabled="{{noneUnread}}" style="{{markAllStyle}}">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg>
              Mark all as read
            </button>
            <a href="#" class="ghost" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 13px; font-weight: 500; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>
              Settings
            </a>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
          <div role="tablist" aria-label="Show" style="display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 3px; box-sizing: border-box; border-radius: 10px; background: var(--muted)">
            <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
              <button type="button" role="tab" class="tab" aria-selected="{{v.ariaSel}}" onClick="{{v.pick}}" style="{{v.style}}">
                {{v.label}}
                <sc-if value="{{v.hasCount}}" hint-placeholder-val="{{false}}">
                  <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--chip); color: var(--text-2); font-size: 11px; font-weight: 500">{{v.count}}</span>
                </sc-if>
              </button>
            </sc-for>
          </div>
          <div role="group" aria-label="Kind" style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
              <button type="button" aria-pressed="{{k.ariaPressed}}" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}</button>
            </sc-for>
          </div>
        </div>

        <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 16px">
            <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
              <section style="display: flex; flex-direction: column; gap: 6px">
                <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 500; color: var(--muted-fg)">{{g.title}}</h2>
                <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
                  <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
                    <li class="nrow" style="{{n.rowStyle}}">
                      <span aria-hidden="true" style="{{n.dotStyle}}"></span>
                      <span aria-hidden="true" style="{{n.tileStyle}}">
                        <sc-if value="{{n.isWorkflow}}" hint-placeholder-val="{{true}}">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
                        </sc-if>
                        <sc-if value="{{n.isWatching}}" hint-placeholder-val="{{false}}">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </sc-if>
                        <sc-if value="{{n.isSecurity}}" hint-placeholder-val="{{false}}">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>
                        </sc-if>
                        <sc-if value="{{n.isAdmin}}" hint-placeholder-val="{{false}}">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        </sc-if>
                      </span>
                      <a href="{{n.href}}" onClick="{{n.read}}" class="nlink" style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; text-decoration: none; color: var(--fg)">
                        <span style="{{n.textStyle}}"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{n.srUnread}}</span>{{n.text}}</span>
                        <span style="font-size: 12px; line-height: 16px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.sub}}</span>
                      </a>
                      <span style="font-size: 12px; color: var(--muted-fg); white-space: nowrap; font-variant-numeric: tabular-nums">{{n.time}}</span>
                      <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}">
                        <button type="button" class="ghost nctl" aria-label="{{n.markLabel}}" title="Mark as read" onClick="{{n.read}}" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); cursor: pointer; flex-shrink: 0">
                          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                        </button>
                      </sc-if>
                      <sc-if value="{{n.isRead}}" hint-placeholder-val="{{true}}">
                        <span aria-hidden="true" style="width: 28px; flex-shrink: 0"></span>
                      </sc-if>
                    </li>
                  </sc-for>
                </ul>
              </section>
            </sc-for>
            <div style="display: flex; justify-content: center">
              <button type="button" class="ghost" style="height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 13px; font-weight: 500; cursor: pointer">Show older</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 24px; border: 1px dashed var(--border); border-radius: 10px; text-align: center">
            <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; background: var(--muted); color: var(--fg)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
            </span>
            <span style="font-weight: 500; font-size: 16px">{{emptyTitle}}</span>
            <span style="font-size: 14px; color: var(--muted-fg); max-width: 380px">Notifications about your account and work appear here.</span>
          </div>
        </sc-if>
      </div>
    </main>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  data() {
    return [
      { id: 'n1', day: 'Today', cat: 'WORKFLOW', text: 'Reminder: memo CR/2026/0142 is waiting for your decision', sub: 'Credit line renewal for Meghna Agro · Head of Credit review', time: '09:00', href: 'Memo.dc.html' },
      { id: 'n2', day: 'Today', cat: 'WORKFLOW', text: 'Memo CR/2026/0142 is overdue', sub: 'Due yesterday at 17:00', time: '08:00', href: 'Memo.dc.html', urgent: true },
      { id: 'n3', day: 'Today', cat: 'WATCHING', text: 'You were mentioned in a note on memo PRC/2026/0087', sub: 'Rafiq Chowdhury: “@Farhana can Credit confirm the vendor exposure?”', time: '08:42', href: '#' },
      { id: 'n4', day: 'Yesterday', cat: 'WORKFLOW', text: 'Memo FIN/2026/0298 is waiting for your approval', sub: 'ATM fleet replacement, phase 2 · Risk review', time: '15:47', href: '#' },
      { id: 'n5', day: 'Yesterday', cat: 'WATCHING', text: 'There is news about memo CR/2025/0388', sub: 'Linked as followed up by CR/2026/0142', time: '11:10', href: '#' },
      { id: 'n6', day: 'Yesterday', cat: 'SECURITY', text: 'New sign-in to your account from Chrome on Windows', sub: 'Dhaka, Bangladesh · not you? Check your devices', time: '08:31', href: '#' },
      { id: 'n7', day: 'Earlier this week', cat: 'WORKFLOW', text: 'Memo AUD/2026/0021 was copied to you for information', sub: 'Internal audit plan 2027', time: 'Mon 13:10', href: '#' },
      { id: 'n8', day: 'Earlier this week', cat: 'WORKFLOW', text: 'Your changes to Credit memo — Meghna Agro.docx in the browser editor could not be saved', sub: 'Open the document again to recover them', time: 'Mon 10:02', href: '#', urgent: true },
      { id: 'n9', day: 'Earlier this week', cat: 'ADMINISTRATION', text: 'You were given the role Credit approver', sub: 'By the administrator, for Credit Risk', time: 'Sun 16:20', href: '#' }
    ];
  }
  renderVals() {
    const st = this.state || {};
    const view = st.view || 'all';
    const kind = st.kind || 'ALL';
    const readSet = st.readSet || { n4: true, n5: true, n7: true, n9: true, n6: true, n8: false };
    const all = this.data().map((d) => Object.assign({}, d, { unread: !readSet[d.id] }));
    const unreadCount = all.filter((d) => d.unread).length;
    const setRead = (id) => { const next = Object.assign({}, readSet); next[id] = true; this.setState({ readSet: next }); };

    const tabBase = 'display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; ';
    const views = [{ id: 'all', label: 'All' }, { id: 'unread', label: 'Unread', count: unreadCount }].map((v) => ({
      label: v.label, count: v.count, hasCount: !!v.count,
      ariaSel: v.id === view ? 'true' : 'false',
      style: tabBase + (v.id === view ? 'border: 1px solid var(--border); background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.06)' : 'border: 1px solid transparent; background: transparent; color: var(--muted-fg)'),
      pick: () => this.setState({ view: v.id })
    }));
    const chip = 'height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; font-weight: 500; cursor: pointer; ';
    const kinds = [
      { id: 'ALL', label: 'All kinds' }, { id: 'WORKFLOW', label: 'Memo approvals' }, { id: 'WATCHING', label: 'Memos you follow' },
      { id: 'SECURITY', label: 'Security' }, { id: 'ADMINISTRATION', label: 'Access and administration' }
    ].map((k) => ({
      label: k.label,
      ariaPressed: k.id === kind ? 'true' : 'false',
      style: chip + (k.id === kind ? 'border: 1px solid var(--primary); background: var(--primary); color: var(--primary-fg)' : 'border: 1px solid var(--border); background: var(--bg); color: var(--text-2)'),
      pick: () => this.setState({ kind: k.id })
    }));

    const tileColors = {
      WORKFLOW: 'background: var(--muted); color: var(--fg)',
      WATCHING: 'background: var(--info-bg); color: var(--info-fg)',
      SECURITY: 'background: var(--warn-bg); color: var(--warn-fg)',
      ADMINISTRATION: 'background: var(--muted); color: var(--text-2)'
    };
    const shown = all.filter((d) => (view === 'all' || d.unread) && (kind === 'ALL' || d.cat === kind));
    const groupsOrder = ['Today', 'Yesterday', 'Earlier this week'];
    const groups = groupsOrder.map((g) => ({
      title: g,
      items: shown.filter((d) => d.day === g).map((d) => ({
        text: d.text, sub: d.sub, time: d.time, href: d.href,
        unread: d.unread, isRead: !d.unread,
        srUnread: d.unread ? 'Unread: ' : '',
        markLabel: 'Mark as read: ' + d.text,
        isWorkflow: d.cat === 'WORKFLOW', isWatching: d.cat === 'WATCHING', isSecurity: d.cat === 'SECURITY', isAdmin: d.cat === 'ADMINISTRATION',
        read: () => setRead(d.id),
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 10px; border-bottom: 1px solid var(--hover)' + (d.unread ? '; background: var(--subtle)' : ''),
        dotStyle: 'width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: ' + (d.unread ? (d.urgent ? 'var(--destructive)' : 'var(--primary)') : 'transparent'),
        tileStyle: 'display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; ' + (d.urgent ? 'background: var(--danger-bg); color: var(--danger-fg)' : tileColors[d.cat]),
        textStyle: 'font-size: 14px; line-height: 20px; ' + (d.unread ? 'font-weight: 600' : 'font-weight: 400; color: var(--text-1)')
      }))
    })).filter((g) => g.items.length > 0);

    const navOpen = !!st.navOpen;
    const collapsed = !!st.collapsed;
    const closeNav = () => this.setState({ navOpen: false });
    const isMac = typeof navigator !== 'undefined' && /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
    return {
      themeClass: (this.state && this.state.theme) || this.props.theme || 'system',
      views: views,
      kinds: kinds,
      groups: groups,
      hasItems: groups.length > 0,
      empty: groups.length === 0,
      emptyTitle: view === 'unread' ? 'Nothing unread.' : 'Nothing here yet.',
      noneUnread: unreadCount === 0,
      markAll: () => { const next = {}; all.forEach((d) => { next[d.id] = true; }); this.setState({ readSet: next }); },
      markAllStyle: 'display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 13px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); ' + (unreadCount === 0 ? 'color: var(--muted-fg); cursor: default' : 'color: var(--fg); cursor: pointer'),
      shortcut: isMac ? '⌘K' : 'Ctrl K',
      sidebarClass: 'sidebar' + (navOpen ? ' open' : '') + (collapsed && !navOpen ? ' collapsed' : ''),
      scrimClass: 'scrim' + (navOpen ? ' open' : ''),
      navAria: (navOpen || !collapsed) ? 'true' : 'false',
      toggleNav: () => {
        const narrow = typeof window !== 'undefined' && window.innerWidth <= 860;
        if (narrow) this.setState({ navOpen: !navOpen });
        else this.setState({ collapsed: !collapsed });
      },
      closeNav: closeNav,
      navKey: (ev) => { if (ev && ev.key === 'Escape') closeNav(); }
    };
  }
}
</script>
