# Phase 4 E01 forum types and forums (design E01 §3, §4; ADR-0056, ADR-0057). Rules: rules.yaml. forum.types.manage
# (maker) and forum.types.approve (checker) are privileged: tenant admins hold both, so the maker-checker split itself
# (SAME_PERSON) is ForumTypesIT. Random type ids are 404 for everyone allowed through.
epic: P4-E01
endpoints:
  - { endpoint: GET /api/v1/admin/forum-types, rule: tenantAdmin }
  - { endpoint: GET /api/v1/admin/forum-types/presets, rule: tenantAdmin }
  - endpoint: POST /api/v1/admin/forum-types
    rule: tenantAdmin
    body: { code: "MX", name: "Matrix committee type", preset: "BOARD_COMMITTEE" }
  - { endpoint: "GET /api/v1/admin/forum-types/{typeId}", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/forum-types/{typeId}/activate", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/forum-types/{typeId}/deactivate", rule: tenantAdmin }
  - { endpoint: "GET /api/v1/admin/forum-types/{typeId}/versions", rule: tenantAdmin }
  - { endpoint: "GET /api/v1/admin/forum-types/{typeId}/versions/{number}", rule: tenantAdmin }
  - { endpoint: "POST /api/v1/admin/forum-types/{typeId}/versions", rule: tenantAdmin }
  - endpoint: "PUT /api/v1/admin/forum-types/{typeId}/versions/{number}"
    rule: tenantAdmin
    body: { name: "Matrix type", outcomes: [{ kind: "APPROVED", label: "Approved", resolution: true }] }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/admin/forum-types/{typeId}/versions/{number}/submit", rule: tenantAdmin, headers: { If-Match: "\"0\"" } }
  - { endpoint: "POST /api/v1/admin/forum-types/{typeId}/versions/{number}/approve", rule: tenantAdminStepUp }
  - { endpoint: "POST /api/v1/admin/forum-types/{typeId}/versions/{number}/send-back", rule: tenantAdmin, body: { remark: "Matrix" } }
  - endpoint: POST /api/v1/forums/quorum-preview
    rule: tenantAdmin
    body: { rule: { minimum: 2 }, members: [{ role: "CHAIR", present: true }, { role: "MEMBER", present: true }] }
  - { endpoint: GET /api/v1/admin/workflow/escalation-targets, rule: tenantAdmin }
  - { endpoint: GET /api/v1/forums, rule: signedIn }
  - endpoint: POST /api/v1/forums
    rule: tenantAdmin
    body: { key: "matrix-committee", code: "MXC", name: "Matrix committee", shortName: "Matrix", typeId: "{random}" }
    headers: { Idempotency-Key: "{random}" }
  - { endpoint: "GET /api/v1/forums/{forumId}", rule: signedIn }
  - endpoint: "PATCH /api/v1/forums/{forumId}"
    rule: tenantAdmin
    body: { key: "matrix-committee", code: "MXC", name: "Matrix committee", shortName: "Matrix", typeId: "{random}" }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/forums/{forumId}/dissolve"
    rule: tenantAdmin
    body: { reason: "Matrix" }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/forums/{forumId}/clone"
    rule: tenantAdmin
    body: { key: "matrix-clone", code: "MXK", name: "Matrix clone", shortName: "Clone" }
    headers: { Idempotency-Key: "{random}" }
  - { endpoint: "GET /api/v1/forums/{forumId}/members", rule: signedIn }
  - endpoint: "POST /api/v1/forums/{forumId}/members"
    rule: signedIn
    body: { userId: "{random}", role: "MEMBER" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "PATCH /api/v1/forums/{forumId}/members/{memberId}"
    rule: signedIn
    body: { voting: true }
    headers: { If-Match: "\"0\"" }
  - endpoint: "POST /api/v1/forums/{forumId}/members/{memberId}/end"
    rule: signedIn
    body: { reason: "RESIGNED" }
    headers: { If-Match: "\"0\"" }
  - { endpoint: "POST /api/v1/forums/{forumId}/members/{memberId}/renew", rule: signedIn }
  - { endpoint: "POST /api/v1/forums/{forumId}/members/{memberId}/change-role", rule: signedIn, body: { role: "VICE_CHAIR" } }
  - { endpoint: "POST /api/v1/forums/{forumId}/members/{memberId}/withdraw", rule: signedIn }
  - { endpoint: GET /api/v1/me/forums, rule: signedIn }
