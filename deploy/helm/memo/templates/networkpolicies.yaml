{{- if .Values.networkPolicy.enabled }}
# Default deny for every pod of this release; then only the flows the architecture needs (threat models E01–E05).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    {{- include "memo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
# web: ingress from the ingress controller; egress to the backend and DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "memo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "memo.selector" (dict "root" . "name" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressFromNamespaceLabels | nindent 14 }}
      ports: [{ port: 8080 }]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "memo.selector" (dict "root" . "name" "backend") | nindent 14 }}
      ports: [{ port: 8080 }]
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# backend + migration job: ingress from web only (API port); egress to DNS and the configured dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "memo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name | quote }}] }
      - { key: app.kubernetes.io/name, operator: In, values: [backend, migrate] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "memo.selector" (dict "root" . "name" "web") | nindent 14 }}
      ports: [{ port: 8080 }]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    # Same-namespace dependencies (e.g. PostgreSQL, SeaweedFS, ONLYOFFICE, ClamAV deployed alongside).
    - to:
        - podSelector: {}
    {{- range .Values.networkPolicy.backendEgressCidrs }}
    - to:
        - ipBlock: { cidr: {{ . | quote }} }
    {{- end }}
{{- end }}
