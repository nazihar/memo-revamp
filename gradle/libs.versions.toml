# All versions pinned. Verified 2026-10-14 — see docs/adr/0002-toolchain-baseline.md and docs/dependencies.md.
[versions]
java = "25"
kotlin = "2.4.21"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
springdoc = "3.1.1"
aws-sdk = "2.55.16"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"
foojay = "1.0.0"
mockk = "1.14.11"
jug = "5.2.0"
jqwik = "1.10.2"
cyclonedx = "3.5.1"
spotbugs-gradle = "6.5.13"
spotbugs = "4.10.5"
findsecbugs = "1.14.0"
# Security overrides ahead of Spring Boot 4.1.1 managed versions (Trivy, 2026-10-14). Remove once Boot manages >= these.
# tomcat: CVE-2026-65182/65905/68525 (CRITICAL); jackson 2/3: CVE-2026-89407/89425/68497/91776/91777 (HIGH)
security-tomcat = "11.0.25"
security-jackson2 = "2.22.3"
security-jackson3 = "3.1.7"

[libraries]
# Platforms / BOMs
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }

# Spring (versions from the Boot BOM)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-modulith-runtime = { module = "org.springframework.modulith:spring-modulith-runtime" }
jooq-codegen = { module = "org.jooq:jooq-codegen" }
jooq-meta = { module = "org.jooq:jooq-meta" }
jug = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "jug" }
springdoc-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
aws-s3 = { module = "software.amazon.awssdk:s3" }
aws-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }

# Test
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

# Gradle plugins used by build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
cyclonedx-gradle-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-gradle" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
security-tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "security-tomcat" }
security-jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "security-jackson2" }
security-jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "security-jackson3" }

[plugins]
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
