# Email templates (ADR-0030), Arabic: proves right-to-left rendering (Phase 1a Q8). Same keys as messages.properties.
mail.INVITATION.subject=دعوة إلى memo
mail.INVITATION.body=مرحبًا {name}،\n\nدعاك {inviter} للانضمام إلى {organisation} على memo. عيّن كلمة المرور وابدأ من هنا:\n\n{link}\n\nيعمل الرابط مرة واحدة وتنتهي صلاحيته بعد 7 أيام. إذا لم تكن تتوقع هذه الدعوة فيمكنك تجاهل هذه الرسالة.
mail.PASSWORD_RESET.subject=إعادة تعيين كلمة مرور memo
mail.PASSWORD_RESET.body=مرحبًا {name}،\n\nطلب أحدهم إعادة تعيين كلمة مرورك في {organisation} على memo. اختر كلمة مرور جديدة من هنا:\n\n{link}\n\nيعمل الرابط مرة واحدة وتنتهي صلاحيته بعد 30 دقيقة. إذا لم تكن أنت فتجاهل هذه الرسالة وستبقى كلمة مرورك كما هي.
mail.PASSWORD_CHANGED.subject=تم تغيير كلمة مرور memo
mail.PASSWORD_CHANGED.body=مرحبًا {name}،\n\nتم للتو تغيير كلمة مرور حسابك في {organisation}، وتم تسجيل الخروج من جلساتك الأخرى.\n\nإذا لم تكن أنت فاتصل بالمسؤول الآن.
mail.MFA_RESET.subject=تمت إعادة تعيين تسجيل الدخول إلى memo
mail.MFA_RESET.body=مرحبًا {name}،\n\nأعاد مسؤول في {organisation} تعيين التحقق بخطوتين لحسابك. ستُعِد تطبيق المصادقة من جديد عند تسجيل دخولك القادم.\n\nإذا لم تكن تتوقع ذلك فاتصل بالمسؤول.
mail.SIGN_IN_ALERT.subject=تسجيل دخول جديد إلى memo
mail.SIGN_IN_ALERT.body=مرحبًا {name}،\n\nتم تسجيل الدخول إلى حسابك في {organisation} من جهاز جديد:\n\n{device}\n{time} (UTC)\n\nإذا لم تكن أنت فغيّر كلمة مرورك واتصل بالمسؤول.
mail.ROLE_GRANTED.subject=تغيّرت صلاحياتك في memo
mail.ROLE_GRANTED.body=مرحبًا {name}،\n\nمُنحت الدور {role} في {organisation}. يسري ذلك عند فتحك memo في المرة القادمة.\n\nإذا لم تكن تتوقع ذلك فاتصل بالمسؤول.
mail.TEST.subject=رسالة اختبار من memo
mail.TEST.body=مرحبًا {name}،\n\nوصلت رسالة الاختبار هذه من {organisation} على memo عبر خادم البريد المضبوط. لا يلزم أي إجراء.
mail.TASK_ASSIGNED.subject=مذكرة بانتظار موافقتك
mail.TASK_ASSIGNED.body=مرحبًا {name}،\n\n{memo} {reference} في {organisation} بانتظار موافقتك. افتحها من هنا:\n\n{link}
mail.MEMO_RETURNED.subject=أُعيدت إليك مذكرة
mail.MEMO_RETURNED.body=مرحبًا {name}،\n\nأُعيدت إليك {memo} {reference} في {organisation}. افتحها لقراءة الملاحظة:\n\n{link}
mail.MEMO_REJECTED.subject=رُفضت مذكرة
mail.MEMO_REJECTED.body=مرحبًا {name}،\n\nرُفضت {memo} {reference} في {organisation}. افتحها لقراءة الملاحظة:\n\n{link}
mail.MEMO_APPROVED.subject=تمت الموافقة على مذكرتك
mail.MEMO_APPROVED.body=مرحبًا {name}،\n\nوافق جميع من في مسار {memo} {reference} في {organisation}:\n\n{link}
mail.TASK_REASSIGNED.subject=أُعيد إسناد مهمة مذكرة
mail.TASK_REASSIGNED.body=مرحبًا {name}،\n\nأعاد مسؤول في {organisation} إسناد الموافقة على {memo} {reference}. افتحها لمعرفة من يتولاها الآن:\n\n{link}
mail.TASK_BLOCKED.subject=مذكرة بانتظار إعادة الإسناد
mail.TASK_BLOCKED.body=مرحبًا {name}،\n\nلا يستطيع المعتمد التالي لـ{memo} {reference} في {organisation} التصرف فيها حاليًا. يجب أن يسند مسؤول المهمة إلى شخص آخر:\n\n{link}
mail.MEMO_WITHDRAWN.subject=سُحبت مذكرة كنت تراجعها
mail.MEMO_WITHDRAWN.body=مرحبًا {name}،\n\nسحب منشئ {memo} {reference} في {organisation} هذه المذكرة. لا يلزمك أي إجراء.\n\n{link}
mail.MEMO_UPDATE.subject=مستجدات بشأن مذكرة
mail.MEMO_UPDATE.body=مرحبًا {name}،\n\nبلغت {memo} {reference} في {organisation} خطوة تُبقيك على اطلاع. افتحها لمعرفة مرحلتها الحالية:\n\n{link}
mail.MEMO_COPIED.subject=نسخة من مذكرة إليك
mail.MEMO_COPIED.body=مرحبًا {name}،\n\nأُرسلت إليك نسخة من {memo} {reference} في {organisation} للعلم. يمكنك قراءتها هنا:\n\n{link}
mail.MEMO_MENTIONED.subject=أُشير إليك في مذكرة
mail.MEMO_MENTIONED.body=مرحبًا {name}،\n\nأشار إليك أحدهم في ملاحظة على {memo} {reference} في {organisation}. افتحها لقراءة الملاحظة:\n\n{link}
mail.TASK_REMINDER.subject=تذكير: مذكرة بانتظارك
mail.TASK_REMINDER.body=مرحبًا {name}،\n\n{memo} {reference} في {organisation} بانتظار قرارك. افتحها لمعرفة موعدها النهائي:\n\n{link}
mail.TASK_OVERDUE.subject=مذكرة تجاوزت موعدها
mail.TASK_OVERDUE.body=مرحبًا {name}،\n\nتجاوزت الخطوة الحالية لـ{memo} {reference} في {organisation} موعدها النهائي. افتحها لمعرفة من يتولاها:\n\n{link}
mail.footer=أُرسلت هذه الرسالة من memo. لا ترد عليها.

# Default terms (ADR-0032): {unit}, {units}, {position}, {positions}, {memo}, {memos}, {forum}, {forums} in templates; tenants may override.
term.unit.one=وحدة
term.unit.other=وحدات
term.position.one=وظيفة
term.position.other=وظائف
term.memo.one=مذكرة
term.memo.other=مذكرات
term.forum.one=لجنة
term.forum.other=لجان
mail.WATCH_UPDATE.subject=مستجدات على مذكرة تتابعها
mail.WATCH_UPDATE.body=مرحبًا {name}،\n\nهناك مستجدات على {memo} {reference} في {organisation}، وأنت تتابعها. افتحها لترى ما تغيّر:\n\n{link}\n\nيمكنك إيقاف متابعتها من المذكرة، أو تغيير طريقة إبلاغك بالمذكرات التي تتابعها من إعدادات الإشعارات.
mail.WATCH_DIGEST.subject=ملخصك اليومي للمذكرات التي تتابعها
mail.WATCH_DIGEST.body=مرحبًا {name}،\n\nلدى {count} من المذكرات التي تتابعها في {organisation} مستجدات منذ الأمس. اطّلع عليها في قائمة المتابعة:\n\n{link}\n\nيمكنك تغيير طريقة إبلاغك بالمذكرات التي تتابعها من إعدادات الإشعارات.
mail.FORUM_MEMBERSHIP_CHANGED.subject=تغيّرت عضوية إحدى اللجان
mail.FORUM_MEMBERSHIP_CHANGED.body=مرحبًا {name}،\n\nتغيّرت عضوية {committee} في {organisation}. افتحها لترى أعضاءها الآن:\n\n{link}\n\nإذا لم تكن تتوقع ذلك فاتصل بأمين سر اللجنة.
mail.FORUM_TERM_ENDING.subject=تنتهي إحدى فترات العضوية قريبًا
mail.FORUM_TERM_ENDING.body=مرحبًا {name}،\n\nتنتهي قريبًا فترة عضوية {member} في {committee} في {organisation}. جدّدها أو سجّل انتهاءها:\n\n{link}
mail.FORUM_SUBMISSION_RECEIVED.subject=ورقة بانتظار لجنتك
mail.FORUM_SUBMISSION_RECEIVED.body=مرحبًا {name}،\n\nأُرسلت ورقة إلى {committee} في {organisation}. افتح القائمة لقبولها أو تأجيلها أو إعادتها:\n\n{link}
mail.FORUM_SUBMISSION_TRIAGED.subject=مستجدات على ورقة أرسلتها إلى لجنة
mail.FORUM_SUBMISSION_TRIAGED.body=مرحبًا {name}،\n\nاطّلعت {committee} في {organisation} على ورقتك. افتحها لترى وضعها وأي سبب مذكور:\n\n{link}
mail.FORUM_SUBMISSION_WAITING.subject=ورقة ما زالت تنتظر الفرز
mail.FORUM_SUBMISSION_WAITING.body=مرحبًا {name}،\n\nلم تُقبل بعدُ ورقة أُرسلت إلى {committee} في {organisation}، ولم تؤجَّل أو تُعَد، وصاحبها ينتظر ردًّا:\n\n{link}
mail.MEETING_CANCELLED.subject=أُلغي اجتماع
mail.MEETING_CANCELLED.body=مرحبًا {name}،\n\nأُلغي اجتماع {committee} في {organisation} المقرر في {date}. افتحه لترى السبب:\n\n{link}
mail.MEETING_LATE_PAPER.subject=ورقة متأخرة تحتاج إلى موافقتك
mail.MEETING_LATE_PAPER.body=مرحبًا {name}،\n\nوصلت ورقة لاجتماع {committee} في {organisation} المقرر في {date} بعد الموعد المحدد لتقديم الأوراق. لن تُدرج في جدول الأعمال إلا بموافقتك. افتح الاجتماع لتوافق أو ترفض:\n\n{link}
mail.MEETING_AGENDA_PUBLISHED.subject=نُشر جدول أعمال اجتماع
mail.MEETING_AGENDA_PUBLISHED.body=مرحبًا {name}،\n\nنُشر جدول أعمال اجتماع {committee} في {organisation} المقرر في {date}. افتح الاجتماع لتقرأه وتقرأ أوراقه. يُرجى قراءة جدول الأعمال والإفصاح عن أي مصلحة لك قبل الاجتماع:\n\n{link}
mail.MEETING_AGENDA_CHANGED.subject=تغيّر جدول أعمال اجتماع
mail.MEETING_AGENDA_CHANGED.body=مرحبًا {name}،\n\nتغيّر جدول أعمال اجتماع {committee} في {organisation} المقرر في {date}. افتح الاجتماع لترى ما تغيّر. إن أُضيفت بنود جديدة، فيُرجى الإفصاح عن أي مصلحة لك فيها قبل الاجتماع:\n\n{link}
mail.MEETING_ITEM_WITHDRAWN.subject=خرج بند من جدول أعمال منشور
mail.MEETING_ITEM_WITHDRAWN.body=مرحبًا {name}،\n\nلم تعد ورقةٌ مدرجة في جدول الأعمال المنشور لاجتماع {committee} في {organisation} المقرر في {date} معروضةً على اللجنة، وقد خرجت من المسودة. انشر مراجعة جديدة ليرى الأعضاء التغيير:\n\n{link}
mail.MEETING_DISCUSSION_REQUESTED.subject=طلب عضو مناقشة بند من بنود الموافقة الجماعية
mail.MEETING_DISCUSSION_REQUESTED.body=مرحبًا {name}،\n\nطلب عضو أن يُرفع بند من قسم الموافقة الجماعية في اجتماع {committee} في {organisation} المقرر في {date} ليُناقَش. افتح الاجتماع لترى البند، وانقله في المراجعة التالية إن لزم:\n\n{link}
mail.MEETING_AGENDA_DUE.subject=لم يُنشر جدول أعمال بعد
mail.MEETING_AGENDA_DUE.body=مرحبًا {name}،\n\nانقضى موعد تقديم أوراق اجتماع {committee} في {organisation} المقرر في {date}، ولم يُنشر جدول أعماله بعد. افتح الاجتماع لإكمال جدول الأعمال ونشره:\n\n{link}
mail.MEETING_NOT_HELD.subject=اجتماع لم يُسجَّل انعقاده
mail.MEETING_NOT_HELD.body=مرحبًا {name}،\n\nانتهى موعد اجتماع {committee} في {organisation} المقرر في {date}، لكنه لم يُسجَّل على أنه عُقد. افتح الاجتماع لتسجيل انعقاده، أو لإعادة جدولته أو إلغائه إن لم يُعقد:\n\n{link}
mail.MEETING_DECLARATION_RECORDED.subject=تغيّرت إفصاحاتك عن المصالح
mail.MEETING_DECLARATION_RECORDED.body=مرحبًا {name}،\n\nسُجِّل إفصاح عن مصلحة باسمك أو تغيّر، لاجتماع {committee} في {organisation} المقرر في {date}. افتح الاجتماع لتراه:\n\n{link}
mail.MEETING_DECLARATION_MADE.subject=تغيّرت الإفصاحات عن المصالح
mail.MEETING_DECLARATION_MADE.body=مرحبًا {name}،\n\nقُدِّم إفصاح عن مصلحة لاجتماع {committee} في {organisation} المقرر في {date}، أو سُحب. افتح الاجتماع لترى الإفصاحات:\n\n{link}
mail.MEETING_RULING_NEEDED.subject=إفصاح عن مصلحة ينتظر قرارك
mail.MEETING_RULING_NEEDED.body=مرحبًا {name}،\n\nأفصح أحد الحاضرين عن مصلحة في بند من بنود اجتماع {committee} في {organisation} المقرر في {date}، ويطلب منك أن تقرر هل يجوز له المشاركة فيه. تُحجب عنه أوراق البند إلى أن تقرر. افتح الاجتماع لتتخذ قرارك:\n\n{link}
mail.MEETING_DECLARATION_RULED.subject=قرّر الرئيس في إفصاحك
mail.MEETING_DECLARATION_RULED.body=مرحبًا {name}،\n\nاتخذ الرئيس قراره في إفصاحك عن مصلحة لاجتماع {committee} في {organisation} المقرر في {date}. افتح الاجتماع لترى القرار:\n\n{link}
mail.MEETING_DECLARATIONS_DUE.subject=يُرجى الإفصاح عن أي مصلحة قبل الاجتماع
mail.MEETING_DECLARATIONS_DUE.body=مرحبًا {name}،\n\nيُعقد اجتماع {committee} في {organisation} في {date}. يُرجى قراءة جدول أعماله، والإفصاح عن أي مصلحة لك في بنوده، ثم تأكيد أنك فعلت ذلك:\n\n{link}
mail.MEETING_INVITATION.subject=أنت مدعو إلى اجتماع
mail.MEETING_INVITATION.body=مرحبًا {name}،\n\nأنت مدعو إلى اجتماع {committee} في {organisation} المقرر في {date}. الدعوة مرفقة لتضيفها إلى تقويمك.\n\nيُرجى إبلاغنا في memo بما إذا كنت ستحضر، فأزرار القبول والرفض في تقويمك لا تصل إلى أمين سر اللجنة:\n\n{link}
mail.MEETING_UPDATED.subject=تغيّر اجتماع
mail.MEETING_UPDATED.body=مرحبًا {name}،\n\nتغيّر اجتماع {committee} في {organisation} المقرر في {date}. {changes} يُحدّث التعديل المرفق تقويمك.\n\nافتح الاجتماع في memo لترى التفاصيل:\n\n{link}
mail.MEETING_UNINVITED.subject=لم تعد مدعواً إلى اجتماع
mail.MEETING_UNINVITED.body=مرحبًا {name}،\n\nلم تعد مدعواً إلى اجتماع {committee} في {organisation} المقرر في {date}. يزيله الإلغاء المرفق من تقويمك.\n\n{link}
mail.MEETING_RSVP_RECORDED.subject=سُجّل ردّك على دعوة إلى اجتماع
mail.MEETING_RSVP_RECORDED.body=مرحبًا {name}،\n\nسجّل أمين سر اللجنة ردّك على الدعوة إلى اجتماع {committee} في {organisation} المقرر في {date}. افتح الاجتماع لتراه، وغيّره إن لم يكن صحيحًا:\n\n{link}
mail.MEETING_ALTERNATE_ASKED.subject=مطلوب منك حضور اجتماع بدلًا من أحد الأعضاء
mail.MEETING_ALTERNATE_ASKED.body=مرحبًا {name}،\n\nطلب منك {member} حضور اجتماع {committee} في {organisation} المقرر في {date} نيابةً عنه بصفتك عضوًا مناوبًا. ستصلك الدعوة لتضيفها إلى تقويمك. يُرجى إبلاغنا في memo بما إذا كنت ستحضر:\n\n{link}
mail.MEETING_ALTERNATE_RELEASED.subject=لم يعد حضورك لاجتماع بدلًا من أحد الأعضاء مطلوبًا
mail.MEETING_ALTERNATE_RELEASED.body=مرحبًا {name}،\n\nلم يعد {member} بحاجة إلى حضورك اجتماع {committee} في {organisation} المقرر في {date} نيابةً عنه. سيُزال الاجتماع من تقويمك.\n\n{link}
mail.MEETING_REPLY_REMINDER.subject=يُرجى إبلاغنا بما إذا كنت ستحضر اجتماعًا
mail.MEETING_REPLY_REMINDER.body=مرحبًا {name}،\n\nيُعقد اجتماع {committee} في {organisation} في {date}، وقد طلب أمين سر اللجنة الردود بحلول اليوم. يُرجى إبلاغنا في memo بما إذا كنت ستحضر:\n\n{link}
mail.MEETING_REMINDER.subject=اقترب موعد اجتماع
mail.MEETING_REMINDER.body=مرحبًا {name}،\n\nنذكّرك بأن اجتماع {committee} في {organisation} يُعقد في {date}.{reply}{declarations}\n\nافتح الاجتماع في memo للاطلاع على جدول أعماله وأوراقه:\n\n{link}
mail.MEETING_QUORUM_AT_RISK.subject=قد لا يكتمل نصاب اجتماع
mail.MEETING_QUORUM_AT_RISK.body=مرحبًا {name}،\n\nبحسب الردود حتى الآن، قد لا يكتمل نصاب اجتماع {committee} في {organisation} المقرر في {date}، أو نصاب بعض بنوده. افتح الاجتماع للاطلاع على الردود والتوقعات، وتابع مع الأعضاء الذين لم يردّوا أو الذين اعتذروا عن الحضور:\n\n{link}
mail.MINUTES_REVIEW_REQUESTED.subject=مسودة محضر جاهزة لمراجعتك
mail.MINUTES_REVIEW_REQUESTED.body=مرحبًا {name}،\n\nمسودة محضر اجتماع {committee} في {organisation} المنعقد في {date} جاهزة لمراجعتك. افتحها في memo لقراءة المسودة واقتراح التعديلات، وإبلاغ أمين السر إن كانت جاهزة للتعميم:\n\n{link}
mail.MINUTES_RETURNED.subject=أُعيدت مسودة محضر مع ملاحظات
mail.MINUTES_RETURNED.body=مرحبًا {name}،\n\nأُعيدت إليك مسودة محضر اجتماع {committee} في {organisation} المنعقد في {date} مع ملاحظات. افتحها في memo لقراءة الملاحظات:\n\n{link}
mail.MINUTES_CIRCULATED.subject=عُمِّمت مسودة محضر لإبداء ملاحظاتك
mail.MINUTES_CIRCULATED.body=مرحبًا {name}،\n\nعُمِّمت مسودة محضر اجتماع {committee} في {organisation} المنعقد في {date} لإبداء الملاحظات. يُرجى قراءة نسختك في memo وإبلاغ أمين السر بملاحظاتك إن وُجدت قبل {until}. إن لم تردّ، يُعدّ ذلك أنه لا ملاحظات لديك:\n\n{link}
mail.MINUTES_COMMENTS_REQUESTED.subject=طُلبت ملاحظاتك على مسودة محضر
mail.MINUTES_COMMENTS_REQUESTED.body=مرحبًا {name}،\n\nيطلب أمين سر {committee} في {organisation} ملاحظاتك على أجزاء من مسودة محضر الاجتماع المنعقد في {date}، قبل {until}. اقرأ نسختك في memo:\n\n{link}
mail.MINUTES_COMMENTS_CLOSING.subject=تنتهي اليوم مهلة الملاحظات على مسودة محضر
mail.MINUTES_COMMENTS_CLOSING.body=مرحبًا {name}،\n\nتنتهي في آخر اليوم، {until}، مهلة الملاحظات على مسودة محضر اجتماع {committee} في {organisation} المنعقد في {date}. إن كانت لديك ملاحظات فأرسلها في memo الآن؛ وإن لم تردّ، يُعدّ ذلك أنه لا ملاحظات لديك:\n\n{link}
mail.MINUTES_CONFIRMATION_REQUESTED.subject=محضر جاهز لاعتمادك
mail.MINUTES_CONFIRMATION_REQUESTED.body=مرحبًا {name}،\n\nمحضر اجتماع {committee} في {organisation} المنعقد في {date} جاهز لاعتمادك. افتحه في memo لقراءة المحضر النهائي واعتماده باستخدام تطبيق المصادقة:\n\n{link}
mail.MINUTES_APPROVED.subject=اعتُمد محضر
mail.MINUTES_APPROVED.body=مرحبًا {name}،\n\nاعتمد الرئيس محضر اجتماع {committee} في {organisation} المنعقد في {date}، وأصبح الآن سجل اللجنة. يمكنك قراءة نسختك في memo:\n\n{link}
mail.ACTION_ASSIGNED.subject=إجراء من لجنة مُسنَد إليك
mail.ACTION_ASSIGNED.body=مرحبًا {name}،\n\nأسندت إليك {committee} في {organisation} إجراءً موعد إنجازه {date} (المرجع {reference}). افتح الإجراء في memo:\n\n{link}
mail.ACTION_OWNER_CHANGED.subject=تغيّر المسؤول عن إجراء من لجنة
mail.ACTION_OWNER_CHANGED.body=مرحبًا {name}،\n\nتغيّر المسؤول عن الإجراء {reference} من {committee} في {organisation}، وموعد إنجازه {date}. افتح الإجراء في memo لمعرفة المسؤول عنه الآن:\n\n{link}
mail.ACTION_RISK_ACCEPTED.subject=أُغلق إجراء من لجنة مع قبول المخاطر
mail.ACTION_RISK_ACCEPTED.body=مرحبًا {name}،\n\nأُلغي الإجراء {reference} من {committee} في {organisation} مع قبول المخاطر، وسجّل ذلك أمين سر اللجنة نيابةً عنك. افتح الإجراء في memo لمراجعته:\n\n{link}
mail.ACTION_ESCALATED.subject=إجراء متأخر من لجنة
mail.ACTION_ESCALATED.body=مرحبًا {name}،\n\nتأخّر إجراء من {committee} في {organisation} يتولاه {holder} {days} من أيام العمل (المرجع {reference}، وموعد إنجازه {date}). أُبلغت بذلك تصعيدًا لإجراء اللجنة. افتح memo:\n\n{link}
mail.ACTION_SENT_BACK.subject=أُعيد إليك إجراء من لجنة
mail.ACTION_SENT_BACK.body=مرحبًا {name}،\n\nأُعيد إليك الإجراء {reference} من {committee} في {organisation}، وموعد إنجازه {date}، بعد أن أشرت إلى إنجازه. افتح الإجراء في memo لمعرفة السبب:\n\n{link}
mail.ACTIONS_DIGEST.subject=إجراءات اللجان الخاصة بك
mail.ACTIONS_DIGEST.body=مرحبًا {name}،\n\nلديك إجراءات من لجان في {organisation} تحتاج إلى متابعة:\n\n{lines}\n\nافتح «إجراءاتي» في memo:\n\n{link}
mail.ACTION_UPDATE_REQUESTED.subject=طلب تحديث بشأن إجراء من لجنة
mail.ACTION_UPDATE_REQUESTED.body=مرحبًا {name}،\n\nيُرجى نشر تحديث بشأن الإجراء {reference} من {committee} في {organisation}، وموعد إنجازه {date}، لتُظهر أوراق اللجنة لاجتماعها القادم ما وصل إليه. افتح الإجراء في memo:\n\n{link}
