apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "memo.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "memo.selector" (dict "root" . "name" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "memo.selector" (dict "root" . "name" "backend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "memo.podSecurity" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ .Values.image.backend | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "memo.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
            # The document server's download and callback endpoints (ADR-0037); never behind the Ingress.
            - { name: docedit, containerPort: 8082 }
          env:
            {{- include "memo.backendEnv" . | nindent 12 }}
            - name: MEMO_FLYWAY_ENABLED
              value: "false"
            - name: MEMO_DB_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.appSecret }}, key: password } }
            - name: MEMO_DATA_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.security.dataKeySecret }}, key: dataKey } }
            {{- if .Values.objectStorage.endpoint }}
            - name: MEMO_S3_ENDPOINT
              value: {{ .Values.objectStorage.endpoint | quote }}
            - name: MEMO_S3_REGION
              value: {{ .Values.objectStorage.region | quote }}
            - name: MEMO_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.objectStorage.secret }}, key: accessKey } }
            - name: MEMO_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.objectStorage.secret }}, key: secretKey } }
            {{- end }}
            - name: MEMO_DOCSERVER_URL
              value: {{ .Values.integrations.documentServerUrl | quote }}
            {{- if .Values.integrations.documentServerUrl }}
            - name: MEMO_DOCEDIT_INTERNAL_URL
              value: http://{{ .Release.Name }}-backend:8082
            - name: MEMO_DOCEDIT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "integrations.documentServer.jwtSecret is required with documentServerUrl" .Values.integrations.documentServer.jwtSecret }}
                  key: jwtSecret
            {{- end }}
            - name: MEMO_CLAMAV_HOST
              value: {{ .Values.integrations.malwareScannerHost | quote }}
            - name: MEMO_FILES_MAX_UPLOAD_BYTES
              value: {{ .Values.files.maxUploadBytes | int64 | quote }}
            - name: MEMO_FILES_CONCURRENT_UPLOADS
              value: {{ .Values.files.concurrentUploads | int64 | quote }}
            - name: MEMO_SMTP_HOST
              value: {{ .Values.integrations.smtpHost | quote }}
            - name: MEMO_SMTP_PORT
              value: {{ .Values.integrations.smtpPort | int64 | quote }}
            - name: MEMO_SMTP_FROM
              value: {{ .Values.integrations.smtpFrom | quote }}
            - name: MEMO_SMTP_STARTTLS
              value: {{ .Values.integrations.smtpStarttls | quote }}
            {{- if .Values.integrations.smtpSecret }}
            - name: MEMO_SMTP_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.integrations.smtpSecret }}, key: username } }
            - name: MEMO_SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.integrations.smtpSecret }}, key: password } }
            {{- end }}
            - name: MEMO_TENANCY_MODE
              value: {{ .Values.tenancy.mode | quote }}
            - name: MEMO_TENANCY_BASE_DOMAIN
              value: {{ .Values.tenancy.baseDomain | quote }}
            - name: MEMO_TENANCY_SINGLE_TENANT
              value: {{ .Values.tenancy.singleTenant | quote }}
            - name: MEMO_PUBLIC_URL_TEMPLATE
              value: {{ .Values.tenancy.publicUrlTemplate | quote }}
            - name: MEMO_PLATFORM_ENABLED
              value: {{ .Values.platform.enabled | quote }}
            - name: MEMO_PLATFORM_HOST
              value: {{ .Values.platform.host | quote }}
            - name: MEMO_PLATFORM_PUBLIC_URL
              value: {{ .Values.platform.publicUrl | quote }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Upload spools: ciphertext only (ADR-0029), on node disk rather than in the pod's memory.
            - { name: spool, mountPath: /var/lib/memo/spool }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
        - { name: spool, emptyDir: { sizeLimit: {{ .Values.files.spoolSizeLimit }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "memo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "memo.selector" (dict "root" . "name" "backend") | nindent 4 }}
  ports:
    # Only the API port is in the Service; the management port is reached by the kubelet directly.
    - { name: http, port: 8080, targetPort: http }
    {{- if .Values.integrations.documentServerUrl }}
    - { name: docedit, port: 8082, targetPort: docedit }
    {{- end }}
