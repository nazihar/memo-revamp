    <main style="flex: 1; padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Platform status</h1>
          <p style="margin: 0; font-size: 14px; color: var(--muted-fg)">Whether every part of the platform is working.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="font-size: 13px; color: var(--muted-fg)">{{checked}}</span>
          <button type="button" onClick="{{recheck}}" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
            Check again
          </button>
        </div>
      </div>

      <section role="status" aria-label="Overall" style="{{overall.style}}">
        <span aria-hidden="true" style="{{overall.iconStyle}}">
          <sc-if value="{{overall.up}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
          <sc-if value="{{overall.degraded}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></sc-if>
          <sc-if value="{{overall.down}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">{{overall.title}}</span>
          <span style="font-size: 13px">{{overall.text}}</span>
        </span>
      </section>

      <section aria-labelledby="st-comp" style="display: flex; flex-direction: column; gap: 8px">
        <h2 id="st-comp" style="margin: 0; font-size: 14px; font-weight: 600">Components</h2>
        <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
          <sc-for list="{{components}}" as="c" hint-placeholder-count="5">
            <li style="{{c.rowStyle}}">
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
                <span style="font-weight: 500">{{c.name}}</span>
                <span style="font-size: 12px; line-height: 16px; color: var(--muted-fg)">{{c.what}}</span>
                <sc-if value="{{c.hasImpact}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: var(--text-1)">{{c.impact}}</span></sc-if>
              </span>
              <span style="{{c.chipStyle}}">
                <span aria-hidden="true" style="{{c.dotStyle}}"></span>
                {{c.label}}
              </span>
            </li>
          </sc-for>
        </ul>
        <span style="font-size: 12px; color: var(--muted-fg)">Your administrators are told automatically when a part stops working.</span>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"state":{"editor":"enum","options":["up","degraded","down"],"default":"degraded"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const state = this.props.state || 'degraded';
    const downSet = state === 'up' ? {} : (state === 'degraded' ? { doc: true } : { db: true, doc: true, store: true });
    const comps = [
      { id: 'db', name: 'Database', what: 'Memos, tasks and every record', impact: 'Nothing can be opened or saved.' },
      { id: 'store', name: 'Object storage', what: 'Documents, attachments and final records', impact: 'Files cannot be opened or uploaded.' },
      { id: 'doc', name: 'Document server', what: 'Reading and editing documents in the browser', impact: 'Documents cannot be opened in the browser. You can still download them.' },
      { id: 'scan', name: 'Malware scanner', what: 'Checks every uploaded file', impact: 'Uploads wait until it is back.' },
      { id: 'mail', name: 'Mail', what: 'Email notifications', disabled: true, offText: 'Turned off for your organisation; notifications stay in memo.' }
    ];
    const chip = 'flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; ';
    const dot = 'width: 8px; height: 8px; border-radius: 50%; background: currentColor';
    const components = comps.map((c, i) => {
      const down = !!downSet[c.id];
      const kind = c.disabled ? 'off' : (down ? 'down' : 'up');
      return {
        name: c.name, what: c.what,
        hasImpact: kind !== 'up', impact: kind === 'down' ? c.impact : (c.offText || ''),
        label: kind === 'up' ? 'Working' : (kind === 'down' ? 'Not working' : 'Turned off'),
        dotStyle: dot,
        chipStyle: chip + (kind === 'up' ? 'border: 1px solid var(--ok-border); background: var(--ok-bg); color: var(--ok-fg)' : (kind === 'down' ? 'border: 1px solid var(--danger-border); background: var(--danger-bg); color: var(--danger-fg)' : 'border: 1px solid var(--border); background: var(--muted); color: var(--text-2)')),
        rowStyle: 'display: flex; align-items: center; gap: 16px; padding: 12px 16px' + (i > 0 ? '; border-top: 1px solid var(--hover)' : '') + (kind === 'down' ? '; background: var(--subtle)' : '')
      };
    });
    const ov = {
      up: { title: 'Everything is working', text: 'All parts of the platform are up.', box: 'border: 1px solid var(--ok-border); background: var(--ok-bg); color: var(--ok-fg)' },
      degraded: { title: 'Some parts are not working', text: 'You can keep working; see below what is affected.', box: 'border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-fg)' },
      down: { title: 'The platform is not working', text: 'Your work is safe. Administrators have been told; try again later.', box: 'border: 1px solid var(--danger-border); background: var(--danger-bg); color: var(--danger-fg)' }
    }[state];
    const navOpen = !!st.navOpen, collapsed = !!st.collapsed;
    const closeNav = () => this.setState({ navOpen: false });
    return {
      themeClass: (this.state && this.state.theme) || this.props.theme || 'system',
      overall: {
        up: state === 'up', degraded: state === 'degraded', down: state === 'down',
        title: ov.title, text: ov.text,
        style: 'display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 10px; ' + ov.box,
        iconStyle: 'display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); flex-shrink: 0'
      },
      components: components,
      checked: st.rechecked ? 'Last checked just now' : 'Last checked 09:14',
      recheck: () => this.setState({ rechecked: true }),
      shortcut: (typeof navigator !== 'undefined' && /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '')) ? '⌘K' : 'Ctrl K',
      sidebarClass: 'sidebar' + (navOpen ? ' open' : '') + (collapsed && !navOpen ? ' collapsed' : ''),
      scrimClass: 'scrim' + (navOpen ? ' open' : ''),
      navAria: (navOpen || !collapsed) ? 'true' : 'false',
      toggleNav: () => {
        const narrow = typeof window !== 'undefined' && window.innerWidth <= 860;
        if (narrow) this.setState({ navOpen: !navOpen });
        else this.setState({ collapsed: !collapsed });
      },
      closeNav: closeNav,
      navKey: (ev) => { if (ev && ev.key === 'Escape') closeNav(); }
    };
  }
}
</script>
