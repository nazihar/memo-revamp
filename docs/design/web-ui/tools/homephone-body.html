  <main style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 14px 16px 24px">

        <a href="Phone.dc.html" style="display: inline-flex; align-items: center; min-height: 36px; font-size: 13px; font-weight: 500">Inbox</a>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
        <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">

                <span style="font-size: 15px; font-weight: 500">{{t.subject}}</span>
                <span style="font-size: 12px; color: var(--muted-fg)">{{t.action}} · {{t.ref}}</span>
              </span>
              <span style="{{t.dueStyle}}">{{t.due}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-labelledby="ph-mine" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="ph-mine" style="margin: 0; font-size: 14px; font-weight: 600">Your memos</h2>
      <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
        <sc-for list="{{mine}}" as="m" hint-placeholder-count="3">
          <li style="{{m.rowStyle}}">
            <a href="{{m.href}}" style="display: flex; align-items: flex-start; gap: 8px; padding: 12px; text-decoration: none; color: var(--fg)">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 500">{{m.subject}}</span>
                <span style="font-size: 12px; color: var(--muted-fg)">{{m.where}}</span>
              </span>
              <span style="{{m.badgeStyle}}">{{m.status}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-labelledby="ph-notif" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 id="ph-notif" style="margin: 0; font-size: 14px; font-weight: 600">Notifications</h2>
        <a href="NotificationsPhone.dc.html" style="display: inline-flex; align-items: center; min-height: 36px; font-size: 13px; font-weight: 500">See all</a>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
          <li style="{{n.rowStyle}}">
            <span aria-hidden="true" style="{{n.dotStyle}}"></span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="{{n.textStyle}}">{{n.text}}</span>
              <span style="font-size: 12px; color: var(--muted-fg)">{{n.time}}</span>
            </span>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>

    const badgeBase = 'flex-shrink: 0; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; ';
    const mine = [
      { subject: 'Branch network risk review, Q3', where: 'Back with you since yesterday', status: 'Returned', href: 'ReturnedPhone.dc.html', s: 'border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-fg)', strong: true },

    return {
