# Phase 4 E07 T3: action items raised, issued and seen (design E07 §3, §4; ADR-0067, ADR-0062). Rules: rules.yaml.
# Meeting, committee and action ids are random here, so every subject allowed through is answered 404 (or 400/422 for a
# body it cannot read) before any role check; "My actions" answers every signed-in user. Who may do what on a real
# meeting (the secretary, forums.manage, the chair, a member, forum.read, the owner outside the committee, a recused
# secretary and a recused member) is ActionsRaiseIT and ActionSubjectIT; another tenant ActionsCrossTenantIT.
#
# Recusal columns (E04 T5's leak suite, RecusalLeakIT): the status on the planted (scheduled) meeting for a member recused
# from the item, one awaiting the chair's ruling, a recused secretary and a recused chair. Raising from the item is refused
# before the meeting's state is looked at: 403 for anyone who does not raise actions, 403 `RECUSED` for the recused
# secretary. A draft of the item ({actionId}) is invisible to all four: 404 to read, edit, discard or issue it.
epic: P4-E07
endpoints:
  - endpoint: "POST /api/v1/meetings/{meetingId}/actions"
    rule: signedIn
    body: { source: "ITEM", itemId: "{item}", title: "Report the revised collateral valuation" }
    headers: { Idempotency-Key: "{random}" }
    recusal: { recused: 403, awaiting: 403, recusedSecretary: 403, recusedChair: 403 }
  - { endpoint: "GET /api/v1/meetings/{meetingId}/actions", rule: signedIn }
  - endpoint: "POST /api/v1/meetings/{meetingId}/actions/issue"
    rule: signedIn
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "POST /api/v1/forums/{forumId}/actions"
    rule: signedIn
    body: { title: "Circulate the revised policy", sourceNote: "Chair's instruction" }
    headers: { Idempotency-Key: "{random}" }
  - endpoint: "GET /api/v1/actions/{actionId}"
    rule: signedIn
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "PATCH /api/v1/actions/{actionId}"
    rule: signedIn
    body: { title: "Report the revised collateral valuation" }
    headers: { If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/discard"
    rule: signedIn
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/issue"
    rule: signedIn
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - { endpoint: "GET /api/v1/me/actions", rule: signedIn }
  # T6: follow-up memos (design E07 §1.11). The owner or a contributor raises a draft memo from the action; the owner, a
  # contributor or a secretary links one they may read. FollowUpMemoIT covers who may on a real action.
  - endpoint: "POST /api/v1/actions/{actionId}/memos"
    rule: signedIn
    body: { typeId: "{random}" }
    headers: { Idempotency-Key: "{random}" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/memos/link"
    rule: signedIn
    body: { memoId: "{random}" }
    headers: { Idempotency-Key: "{random}" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  # Phase 4 E07 T4: progress, dates, the colour, owners, cancelling and reopening, and the timeline. Who may do what on a
  # real action is ActionProgressIT, DueChangeIT, OwnerChangeIT, CancelReopenIT and ActionStateMachineTest; the draft of
  # the item ({actionId} in the recusal columns) is invisible to every recused viewer, so each answers 404.
  - endpoint: "GET /api/v1/actions/{actionId}/entries"
    rule: signedIn
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/updates"
    rule: signedIn
    body: { text: "The valuer is appointed", confidence: "ON_TRACK" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/started"
    rule: signedIn
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/due-requests"
    rule: signedIn
    body: { newDate: "2099-01-20", reason: "The valuer needs more time" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/due-requests/{requestId}/decide"
    rule: signedIn
    body: { decision: "AGREE" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/due"
    rule: signedIn
    body: { newDate: "2099-01-20", reason: "Moved at the meeting" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/rag"
    rule: signedIn
    body: { rag: "RED", reason: "The valuer has withdrawn" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "DELETE /api/v1/actions/{actionId}/rag"
    rule: signedIn
    headers: { If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/owner"
    rule: signedIn
    body: { owner: { kind: "PERSON", userId: "{random}" }, reason: "Treasury leads it now" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/cancel"
    rule: signedIn
    body: { kind: "NO_LONGER_NEEDED", reason: "The loan was withdrawn" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
  - endpoint: "POST /api/v1/actions/{actionId}/reopen"
    rule: signedIn
    body: { dueDate: "2099-01-20", reason: "Not done after all" }
    headers: { Idempotency-Key: "{random}", If-Match: "\"0\"" }
    recusal: { recused: 404, awaiting: 404, recusedSecretary: 404, recusedChair: 404 }
